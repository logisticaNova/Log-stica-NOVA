<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logística Nova - Catálogo y Orden de Compra</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --primary-color: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --accent-color: #f97316;
    --accent-light: #fff7ed;
    --success-color: #10b981;
    --success-dark: #059669;
    --text-main: #111827;
    --text-secondary: #374151;
    --text-muted: #6b7280;
    --bg-body: #f6f8fb;
    --bg-card: #ffffff;
    --bg-soft: #f8fafc;
    --border-color: #e5e7eb;
    --border-light: #eef0f3;
    --radius: 14px;
    --transition: all 0.25s ease;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(180deg, #f8fafc 0%, #f3f5f9 100%);
    color: var(--text-main);
    line-height: 1.5;
    padding-bottom: 60px;
    overflow-x: hidden;
}

.navbar {
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-light);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 13px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar-brand {
    font-size: 1.08rem;
    font-weight: 800;
    color: var(--primary-color);
    letter-spacing: -0.3px;
}

.cart-btn {
    background: var(--primary-color);
    color: white;
    border: none;
    padding: 9px 15px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 0.86rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: var(--transition);
    box-shadow: 0 3px 8px rgba(37,99,235,0.18);
}

.cart-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: 0 5px 12px rgba(37,99,235,0.25);
}

.cart-badge {
    background: var(--accent-color);
    color: white;
    min-width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    padding: 2px 5px;
    font-size: 0.7rem;
    font-weight: 800;
}

header {
    text-align: center;
    margin: 42px 0 28px;
    padding: 0 16px;
}

.header-kicker {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--primary-light);
    color: var(--primary-color);
    border: 1px solid #dbeafe;
    padding: 6px 11px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.45px;
    margin-bottom: 13px;
}

header h1 {
    font-size: clamp(1.9rem, 4vw, 2.65rem);
    color: var(--text-main);
    margin-bottom: 9px;
    font-weight: 800;
    letter-spacing: -1px;
}

header p {
    color: var(--text-muted);
    font-size: 0.92rem;
    max-width: 620px;
    margin: 0 auto;
}

.header-highlight {
    color: var(--accent-color);
    font-weight: 700;
}

.container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 18px;
}

.filtros-wrapper {
    margin-bottom: 28px;
}

.filtros {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 9px;
    scrollbar-width: thin;
    scrollbar-color: #d1d5db transparent;
    -webkit-overflow-scrolling: touch;
}

.filtros::-webkit-scrollbar {
    height: 4px;
}

.filtros::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 20px;
}

.filter-btn {
    flex: 0 0 auto;
    background: rgba(255,255,255,0.9);
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    padding: 8px 15px;
    border-radius: 22px;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
    font-size: 0.8rem;
    transition: var(--transition);
}

.filter-btn:hover {
    border-color: #bfdbfe;
    color: var(--primary-color);
    background: #fff;
}

.filter-btn.active {
    background: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
    box-shadow: 0 3px 8px rgba(37,99,235,0.18);
}

.grid-productos {
    display: grid;
    grid-template-columns: repeat(1, minmax(0, 1fr));
    gap: 20px;
}

.card {
    background: var(--bg-card);
    border-radius: var(--radius);
    border: 1px solid var(--border-color);
    box-shadow: 0 2px 5px rgba(15,23,42,0.035);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    position: relative;
}

.card:hover {
    transform: translateY(-3px);
    border-color: #dbe3ef;
    box-shadow: 0 10px 25px rgba(15,23,42,0.075);
}

.badge-stock {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(255,255,255,0.92);
    color: #047857;
    border: 1px solid #a7f3d0;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 4px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.35px;
    z-index: 10;
    box-shadow: 0 2px 7px rgba(0,0,0,0.06);
}

.product-carousel {
    width: 100%;
    height: 245px;
    background: linear-gradient(145deg, #eef4ff 0%, #f8fafc 55%, #f1f5f9 100%);
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--border-light);
}

.carousel-track {
    width: 100%;
    height: 100%;
    position: relative;
}

.carousel-slide {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease;
}

.carousel-slide.active {
    opacity: 1;
    visibility: visible;
}

.carousel-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.45s ease;
}

.card:hover .carousel-slide.active img {
    transform: scale(1.025);
}

.carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    color: var(--text-main);
    font-size: 23px;
    line-height: 1;
    cursor: pointer;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 9px rgba(0,0,0,0.12);
    transition: var(--transition);
}

.carousel-btn:hover {
    background: white;
    transform: translateY(-50%) scale(1.07);
    color: var(--primary-color);
}

.carousel-prev { left: 11px; }
.carousel-next { right: 11px; }

.carousel-dots {
    position: absolute;
    bottom: 11px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 6px;
    z-index: 5;
}

.carousel-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.78);
    border: 1px solid rgba(0,0,0,0.13);
    cursor: pointer;
    transition: var(--transition);
    padding: 0;
}

.carousel-dot.active {
    background: var(--primary-color);
    transform: scale(1.3);
    border-color: var(--primary-color);
}

.card-body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.card-category {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--primary-color);
    font-weight: 800;
    margin-bottom: 6px;
}

.card-title {
    font-size: 1.03rem;
    font-weight: 750;
    color: var(--text-main);
    margin-bottom: 9px;
    line-height: 1.35;
    letter-spacing: -0.2px;
}

.card-desc {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-bottom: 15px;
    line-height: 1.55;
    min-height: 63px;
}

.descripcion-texto.descripcion-corta {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.ver-mas-btn {
    border: none;
    background: transparent;
    color: var(--primary-color);
    font-weight: 750;
    font-size: 0.76rem;
    cursor: pointer;
    padding: 0;
    margin-left: 4px;
}

.specs-list {
    background: linear-gradient(135deg, #f8fafc, #f9fafb);
    border: 1px solid var(--border-light);
    border-radius: 9px;
    padding: 10px 11px;
    margin-bottom: 16px;
    font-size: 0.77rem;
}

.specs-list div {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    gap: 12px;
}

.specs-list div:last-child { margin-bottom: 0; }

.spec-label { color: var(--text-muted); font-weight: 500; }
.spec-value { color: var(--text-secondary); font-weight: 700; text-align: right; }

.pricing {
    margin-top: auto;
    border-top: 1px solid var(--border-light);
    padding-top: 15px;
}

.price-container {
    display: flex;
    align-items: baseline;
    gap: 9px;
    margin-bottom: 5px;
}

.price-offer {
    font-size: 1.42rem;
    font-weight: 800;
    color: var(--text-main);
    letter-spacing: -0.5px;
}

.cuotas-badge {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    font-size: 0.72rem;
    color: var(--accent-color);
    background: var(--accent-light);
    border: 1px solid #fed7aa;
    border-radius: 6px;
    padding: 5px 8px;
    font-weight: 750;
    margin-top: 3px;
    margin-bottom: 12px;
}

.btn-add-cart {
    width: 100%;
    background: linear-gradient(135deg, var(--primary-color), #3b82f6);
    color: white;
    border: none;
    padding: 11px 12px;
    border-radius: 9px;
    font-weight: 750;
    font-size: 0.84rem;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: 0 3px 8px rgba(37,99,235,0.14);
}

.btn-add-cart:hover {
    background: linear-gradient(135deg, var(--primary-dark), #2563eb);
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(37,99,235,0.2);
}

.paginacion {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin: 34px 0 12px;
}

.paginacion button {
    min-width: 38px;
    height: 38px;
    padding: 0 11px;
    border: 1px solid var(--border-color);
    background: white;
    color: var(--text-secondary);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
}

.paginacion button:hover:not(:disabled) {
    border-color: #bfdbfe;
    color: var(--primary-color);
    background: #f8fbff;
}

.paginacion button.active {
    background: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
    box-shadow: 0 3px 8px rgba(37,99,235,0.18);
}

.paginacion button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(15,23,42,0.48);
    display: flex;
    justify-content: flex-end;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
}

.modal-overlay.active {
    opacity: 1;
    visibility: visible;
}

.cart-drawer {
    background-color: white;
    width: 100%;
    max-width: 480px;
    height: 100%;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.3s ease;
}

.modal-overlay.active .cart-drawer {
    transform: translateX(0);
}

.cart-header {
    padding: 16px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.close-cart {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--text-muted);
}

.cart-body {
    padding: 16px;
    overflow-y: auto;
    flex-grow: 1;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-color);
}

.cart-item-info {
    flex: 1;
    min-width: 0;
}

.cart-item-info h4 { font-size: 0.9rem; margin-bottom: 2px; }
.cart-item-price { font-size: 0.8rem; color: var(--text-muted); }

.cart-item-actions {
    display: flex;
    align-items: center;
    gap: 6px;
}

.qty-btn {
    background-color: var(--bg-body);
    border: 1px solid var(--border-color);
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
}

.remove-btn {
    background: none;
    border: none;
    color: #ef4444;
    cursor: pointer;
    font-size: 0.8rem;
    margin-left: 6px;
}

.payment-methods {
    margin-bottom: 12px;
}

.payment-methods label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 4px;
}

.payment-select {
    width: 100%;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background-color: white;
    font-family: inherit;
    font-size: 0.9rem;
}

.cart-summary-line {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 0.85rem;
}

.cart-total {
    display: flex;
    justify-content: space-between;
    font-size: 1.1rem;
    font-weight: 700;
    margin: 12px 0 6px;
    color: var(--text-main);
}

.installment-summary {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 12px;
    color: #1e40af;
    font-size: 0.82rem;
}

.checkout-btn {
    width: 100%;
    background-color: #10b981;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
}

.checkout-btn:hover { background-color: #059669; }

.form-group {
    margin-bottom: 10px;
}

.form-group label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 3px;
    color: var(--text-main);
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 9px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
}

.form-buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.btn-back {
    background-color: var(--text-muted);
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    width: 35%;
}

.btn-submit-order {
    background-color: #25d366;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    width: 65%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 0.9rem;
}

.btn-submit-order:hover { background-color: #128c7e; }

.empty-cart {
    text-align: center;
    color: var(--text-muted);
    margin-top: 30px;
}

@media (min-width: 640px) {
    .grid-productos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
    .product-carousel { height: 225px; }
}
@media (min-width: 960px) {
    .grid-productos { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
}
@media (min-width: 1200px) {
    .grid-productos { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; }
    .container { padding: 0 20px; }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="navbar-brand">📦 Logística Nova</div>
    <button class="cart-btn" onclick="toggleCart()">
        🛒 Carrito <span class="cart-badge" id="cartCount">0</span>
    </button>
</nav>

<div class="container">
<header>
    <div class="header-kicker">✦ Catálogo exclusivo</div>
    <h1>Catálogo de Productos</h1>
    <p>Encontrá productos seleccionados con <span class="header-highlight">precio especial por transferencia</span> y opciones de pago flexibles.</p>
</header>

<div class="filtros-wrapper">
    <div class="filtros">
        <button class="filter-btn active" onclick="filtrarCategoria('Todas', this)">Todas</button>
        <button class="filter-btn" onclick="filtrarCategoria('Celulares', this)">Celulares</button>
        <button class="filter-btn" onclick="filtrarCategoria('Gaming', this)">Gaming</button>
        <button class="filter-btn" onclick="filtrarCategoria('Televisores / Monitores', this)">Televisores / Monitores</button>
        <button class="filter-btn" onclick="filtrarCategoria('Aires Acondicionados', this)">Aires Acondicionados</button>
        <button class="filter-btn" onclick="filtrarCategoria('Heladeras / Freezers', this)">Heladeras / Freezers</button>
        <button class="filter-btn" onclick="filtrarCategoria('Cocinas / Hornos', this)">Cocinas / Hornos</button>
        <button class="filter-btn" onclick="filtrarCategoria('Lavarropas / Secadoras', this)">Lavarropas / Secadoras</button>
        <button class="filter-btn" onclick="filtrarCategoria('Pequeños Electrodomésticos', this)">Pequeños Electrodomésticos</button>
        <button class="filter-btn" onclick="filtrarCategoria('Aspiradoras', this)">Aspiradoras</button>
        <button class="filter-btn" onclick="filtrarCategoria('Termotanques', this)">Termotanques</button>
        <button class="filter-btn" onclick="filtrarCategoria('Informática', this)">Informática</button>
        <button class="filter-btn" onclick="filtrarCategoria('Audio', this)">Audio</button>
        <button class="filter-btn" onclick="filtrarCategoria('Accesorios', this)">Accesorios</button>
    </div>
</div>

<div class="grid-productos" id="gridProductos"></div>
<div id="paginacion"></div>
</div>

<div class="modal-overlay" id="cartModal" onclick="handleOutsideClick(event)">
    <div class="cart-drawer">
        <div class="cart-header">
            <h3 id="drawerTitle" style="font-size:1.1rem;">Tu Carrito de Compras</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-body" id="cartBodyContent"></div>
    </div>
</div>

<script>

    { id: 2, sku: "CEL-SAM-S24", marca: "Samsung", modelo: "Galaxy S24", nombre: "Celular Samsung Galaxy S24 128GB", categoria: "Celulares", subcategoria: "Smartphones", descripcion: "Potencia impulsada por Inteligencia Artificial, pantalla Dynamic AMOLED 2X y procesador de alto rendimiento.", especificaciones: { pantalla: "6.2 Dynamic AMOLED", almacenamiento: "128GB", ram: "8GB", camara: "50MP" }, precioOferta: 989999, stock: true, imagenes: ["https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?auto=format&fit=crop&w=600&q=80"] },
    { id: 3, sku: "CEL-XIA-NOTE13", marca: "Xiaomi", modelo: "Redmi Note 13 Pro", nombre: "Celular Xiaomi Redmi Note 13 Pro", categoria: "Celulares", subcategoria: "Smartphones", descripcion: "Cámara ultrarrápida de 200MP con estabilización óptica OIS y carga rápida de 67W.", especificaciones: { pantalla: "6.67 AMOLED", almacenamiento: "256GB", ram: "8GB", camara: "200MP" }, precioOferta: 395999, stock: true, imagenes: ["https://images.unsplash.com/photo-1598327105666-5b89351aff97?auto=format&fit=crop&w=600&q=80"] },
    { id: 4, sku: "CEL-APP-IP15", marca: "Apple", modelo: "iPhone 15", nombre: "Celular Apple iPhone 15 128GB", categoria: "Celulares", subcategoria: "Smartphones", descripcion: "Dynamic Island, cámara principal de 48MP con teleobjetivo de 2x y diseño resistente en vidrio infundido.", especificaciones: { pantalla: "6.1 Super Retina XDR", almacenamiento: "128GB", ram: "6GB", camara: "48MP" }, precioOferta: 1349999, stock: true, imagenes: ["https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=600&q=80"] }
];

let carrito = [];
let vistaActual = 'carrito';
let metodoPagoGlobal = 'transferencia';
let cuotasGlobal = 1;
let categoriaSeleccionada = 'Todas';
let estadosCarrusel = {};
const PRODUCTOS_POR_PAGINA = 12;
let paginaActual = 1;

function formatearMoneda(valor) {
    return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(valor);
}

function generarCodigoSeguimiento11Digitos() {
    let codigo = "NV-";
    for (let i = 0; i < 7; i++) {
        codigo += Math.floor(Math.random() * 10);
    }
    return codigo;
}

function filtrarCategoria(categoria, botonElemento) {
    categoriaSeleccionada = categoria;
    paginaActual = 1;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    botonElemento.classList.add('active');
    renderizarProductos();
}

function cambiarImagen(productoId, direccion) {
    const producto = productos.find(p => p.id === productoId);
    if (!producto || !producto.imagenes.length) return;
    if (!estadosCarrusel[productoId]) estadosCarrusel[productoId] = 0;
    const total = producto.imagenes.length;
    estadosCarrusel[productoId] = (estadosCarrusel[productoId] + direccion + total) % total;
    actualizarCarrusel(productoId);
}

function irAImagen(productoId, indice) {
    estadosCarrusel[productoId] = indice;
    actualizarCarrusel(productoId);
}

function actualizarCarrusel(productoId) {
    const indice = estadosCarrusel[productoId] || 0;
    const slides = document.querySelectorAll(`.carousel-slide[data-producto="${productoId}"]`);
    const dots = document.querySelectorAll(`.carousel-dot[data-producto="${productoId}"]`);
    slides.forEach((slide, i) => slide.classList.toggle('active', i === indice));
    dots.forEach((dot, i) => dot.classList.toggle('active', i === indice));
}

function alternarDescripcion(id) {
    const texto = document.getElementById(`descripcion-${id}`);
    const boton = document.getElementById(`verMas-${id}`);
    if (!texto || !boton) return;
    const expandido = texto.classList.contains('expandido');
    if (expandido) {
        texto.classList.remove('expandido');
        texto.classList.add('descripcion-corta');
        boton.innerText = 'Ver más';
    } else {
        texto.classList.remove('descripcion-corta');
        texto.classList.add('expandido');
        boton.innerText = 'Ver menos';
    }
}

function renderizarProductos() {
    const gridContainer = document.getElementById('gridProductos');
    const paginacionContainer = document.getElementById('paginacion');
    gridContainer.innerHTML = '';
    paginacionContainer.innerHTML = '';

    const productosFiltrados = categoriaSeleccionada === 'Todas'
        ? productos
        : productos.filter(p => p.categoria.toLowerCase() === categoriaSeleccionada.toLowerCase());

    if (productosFiltrados.length === 0) {
        gridContainer.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:30px;">No hay productos disponibles en esta categoría.</div>`;
        return;
    }

    const totalPaginas = Math.ceil(productosFiltrados.length / PRODUCTOS_POR_PAGINA);
    if (paginaActual > totalPaginas) paginaActual = totalPaginas;
    if (paginaActual < 1) paginaActual = 1;

    const inicio = (paginaActual - 1) * PRODUCTOS_POR_PAGINA;
    const fin = inicio + PRODUCTOS_POR_PAGINA;
    const productosPagina = productosFiltrados.slice(inicio, fin);

    productosPagina.forEach(producto => {
        if (estadosCarrusel[producto.id] === undefined) estadosCarrusel[producto.id] = 0;

        let specsHTML = '';
        for (const [key, value] of Object.entries(producto.especificaciones)) {
            const etiqueta = key.replace(/([A-Z])/g, ' $1').replace(/^./, letra => letra.toUpperCase());
            specsHTML += `<div><span class="spec-label">${etiqueta}:</span><span class="spec-value">${value}</span></div>`;
        }

        let slidesHTML = '';
        let dotsHTML = '';
        const imagenes = producto.imagenes.filter(img => img && img.trim() !== '').slice(0, 3);

        imagenes.forEach((imagen, index) => {
            slidesHTML += `<div class="carousel-slide ${index === 0 ? 'active' : ''}" data-producto="${producto.id}"><img src="${imagen}" alt="${producto.nombre}" loading="lazy" onerror="this.style.display='none'"></div>`;
            dotsHTML += `<button class="carousel-dot ${index === 0 ? 'active' : ''}" data-producto="${producto.id}" onclick="irAImagen(${producto.id}, ${index})" aria-label="Ver imagen ${index + 1}"></button>`;
        });

        const mostrarControles = imagenes.length > 1;
        const limiteDescripcion = 100;
        const descripcionLarga = producto.descripcion.length > limiteDescripcion;
        const descripcionCorta = descripcionLarga ? producto.descripcion.substring(0, limiteDescripcion) + '...' : producto.descripcion;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            ${producto.stock ? '<span class="badge-stock">✓ Stock</span>' : ''}
            <div class="product-carousel">
                <div class="carousel-track">${slidesHTML}</div>
                ${mostrarControles ? `
                    <button class="carousel-btn carousel-prev" onclick="cambiarImagen(${producto.id}, -1)">‹</button>
                    <button class="carousel-btn carousel-next" onclick="cambiarImagen(${producto.id}, 1)">›</button>
                    <div class="carousel-dots">${dotsHTML}</div>
                ` : ''}
            </div>
            <div class="card-body">
                <span class="card-category">${producto.marca} · ${producto.categoria}</span>
                <h3 class="card-title">${producto.nombre}</h3>
                <p class="card-desc">
                    <span id="descripcion-${producto.id}" class="${descripcionLarga ? 'descripcion-texto descripcion-corta' : 'descripcion-texto'}">${descripcionLarga ? descripcionCorta : producto.descripcion}</span>
                    ${descripcionLarga ? `<button id="verMas-${producto.id}" class="ver-mas-btn" onclick="alternarDescripcion(${producto.id})">Ver más</button>` : ''}
                </p>
                <div class="specs-list">${specsHTML}</div>
                <div class="pricing">
                    <div class="price-container">
                        <span class="price-offer">${formatearMoneda(producto.precioOferta)}</span>
                    </div>
                    <div class="cuotas-badge">⚡ Abonando por transferencia 15% OFF</div>
                    <button class="btn-add-cart" onclick="agregarAlCarrito(${producto.id})">Agregar al Carrito</button>
                </div>
            </div>
        `;
        gridContainer.appendChild(card);
    });
}

function agregarAlCarrito(id) {
    const producto = productos.find(p => p.id === id);
    if (!producto) return;
    const itemExistente = carrito.find(item => item.id === id);
    if (itemExistente) {
        itemExistente.cantidad++;
    } else {
        carrito.push({ ...producto, cantidad: 1 });
    }
    actualizarContadorCarrito();
    vistaActual = 'carrito';
    toggleCart(true);
}

function cambiarCantidad(id, cambio) {
    const item = carrito.find(i => i.id === id);
    if (item) {
        item.cantidad += cambio;
        if (item.cantidad <= 0) {
            carrito = carrito.filter(i => i.id !== id);
        }
    }
    actualizarContadorCarrito();
    renderizarContenidoDrawer();
}

function eliminarDelCarrito(id) {
    carrito = carrito.filter(i => i.id !== id);
    actualizarContadorCarrito();
    renderizarContenidoDrawer();
}

function actualizarContadorCarrito() {
    const totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
    document.getElementById('cartCount').innerText = totalItems;
}

function toggleCart(forceOpen = false) {
    const modal = document.getElementById('cartModal');
    if (forceOpen) {
        modal.classList.add('active');
    } else {
        modal.classList.toggle('active');
        if (!modal.classList.contains('active')) {
            vistaActual = 'carrito';
        }
    }
    renderizarContenidoDrawer();
}

function handleOutsideClick(event) {
    if (event.target.id === 'cartModal') {
        toggleCart();
    }
}

function onPaymentMethodChange() {
    const select = document.getElementById('paymentMethodSelect');
    if (!select) return;
    metodoPagoGlobal = select.value;
    cuotasGlobal = 1; // Resetear cuotas al cambiar método
    renderizarContenidoDrawer();
}

function onCuotasChange() {
    const select = document.getElementById('cuotasSelect');
    if (select) cuotasGlobal = parseInt(select.value) || 1;
    renderizarContenidoDrawer();
}

function calcularTotales() {
    let subtotal = carrito.reduce((sum, item) => sum + (item.precioOferta * item.cantidad), 0);
    let descuento = 0;
    let recargoTotal = 0;

    if (metodoPagoGlobal === 'transferencia') {
        descuento = subtotal * 0.15;
    } else if (metodoPagoGlobal === 'creditoDni') {
        recargoTotal = subtotal * 0.055; // +5.5% de recargo total
    } else if (metodoPagoGlobal === 'tarjetaCredito') {
        recargoTotal = subtotal * 0.08; // +8% de recargo total
    }
    
    const total = subtotal - descuento + recargoTotal;
    const valorCuota = total / cuotasGlobal;
    const recargoPorCuota = recargoTotal / cuotasGlobal;
    return { subtotal, descuento, recargo: recargoTotal, total, valorCuota, recargoPorCuota };
}

function renderizarContenidoDrawer() {
    const drawerTitle = document.getElementById('drawerTitle');
    const bodyContent = document.getElementById('cartBodyContent');

    if (carrito.length === 0) {
        drawerTitle.innerText = "Tu Carrito de Compras";
        bodyContent.innerHTML = `<div class="empty-cart">Tu carrito está vacío.</div>`;
        vistaActual = 'carrito';
        return;
    }

    if (vistaActual === 'carrito') {
        drawerTitle.innerText = "Tu Carrito de Compras";
        let htmlItems = `<div style="flex-grow:1; overflow-y:auto; max-height:38vh;">`;
        carrito.forEach(item => {
            htmlItems += `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <h4>${item.nombre}</h4>
                        <div class="cart-item-price">${formatearMoneda(item.precioOferta)} c/u</div>
                    </div>
                    <div class="cart-item-actions">
                        <button class="qty-btn" onclick="cambiarCantidad(${item.id}, -1)">-</button>
                        <span>${item.cantidad}</span>
                        <button class="qty-btn" onclick="cambiarCantidad(${item.id}, 1)">+</button>
                        <button class="remove-btn" onclick="eliminarDelCarrito(${item.id})">🗑️</button>
                    </div>
                </div>
            `;
        });
        htmlItems += `</div>`;

        const { subtotal, descuento, recargo, total, valorCuota, recargoPorCuota } = calcularTotales();

        // Generar opciones de cuotas dinámicas según método de pago
        let maxCuotas = 1;
        if (metodoPagoGlobal === 'creditoDni') maxCuotas = 6;
        if (metodoPagoGlobal === 'tarjetaCredito') maxCuotas = 12;

        let opcionesCuotasHTML = '';
        for (let i = 1; i <= maxCuotas; i++) {
            opcionesCuotasHTML += `<option value="${i}" ${cuotasGlobal === i ? 'selected' : ''}>${i} ${i === 1 ? 'Pago' : 'Pagos'}</option>`;
        }

        htmlItems += `
            <div style="margin-top:10px; border-top:1px solid var(--border-color); padding-top:12px;">
                <div class="payment-methods">
                    <label for="paymentMethodSelect">Método de Pago:</label>
                    <select id="paymentMethodSelect" class="payment-select" onchange="onPaymentMethodChange()">
                        <option value="transferencia" ${metodoPagoGlobal === 'transferencia' ? 'selected' : ''}>Transferencia Bancaria (15% OFF)</option>
                        <option value="creditoDni" ${metodoPagoGlobal === 'creditoDni' ? 'selected' : ''}>Crédito con DNI (+5.5% por pago)</option>
                        <option value="tarjetaCredito" ${metodoPagoGlobal === 'tarjetaCredito' ? 'selected' : ''}>Tarjeta de Crédito (+8% por pago)</option>
                    </select>
                </div>

                <div class="payment-methods">
                    <label for="cuotasSelect">Cantidad de Pagos / Cuotas (hasta ${maxCuotas}):</label>
                    <select id="cuotasSelect" class="payment-select" onchange="onCuotasChange()">
                        ${opcionesCuotasHTML}
                    </select>
                </div>

                <div class="cart-summary-line"><span>Subtotal:</span><span>${formatearMoneda(subtotal)}</span></div>
                ${descuento > 0 ? `<div class="cart-summary-line" style="color:var(--success-dark)"><span>Descuento Transferencia (15%):</span><span>-${formatearMoneda(descuento)}</span></div>` : ''}
                ${recargo > 0 ? `<div class="cart-summary-line" style="color:var(--accent-color)"><span>Recargo (${metodoPagoGlobal === 'creditoDni' ? '+5.5%' : '+8%'} en cada pago):</span><span>+${formatearMoneda(recargo)}</span></div>` : ''}
                
                <div class="cart-total"><span>Total a Pagar:</span><span>${formatearMoneda(total)}</span></div>
                
                <div class="installment-summary">
                    Primera cuota: <strong>${formatearMoneda(valorCuota)}</strong><br>
                    Cantidad de cuotas a abonar por mes: <strong>${cuotasGlobal} ${cuotasGlobal === 1 ? 'cuota' : 'cuotas'}</strong> de <strong>${formatearMoneda(valorCuota)}</strong> c/u<br>
                    ${recargo > 0 ? `<small style="display:block; margin-top:4px;">Incluye recargo de ${formatearMoneda(recargoPorCuota)} por cada pago.</small>` : ''}
                </div>

                <button class="checkout-btn" onclick="procederAlCheckout()">Continuar con la Orden de Compra</button>
            </div>
        `;
        bodyContent.innerHTML = htmlItems;
    } else if (vistaActual === 'checkout') {
        drawerTitle.innerText = "Datos de Envío y Contacto";
        bodyContent.innerHTML = `
            <form id="orderForm" onsubmit="enviarOrdenWhatsApp(event)">
                <div class="form-group"><label>Nombre y Apellido</label><input type="text" id="nombreCliente" required placeholder="Ej: Juan Pérez"></div>
                <div class="form-group"><label>DNI / CUIL</label><input type="text" id="dniCliente" required placeholder="Ej: 37897087"></div>
                <div class="form-group"><label>Email</label><input type="email" id="emailCliente" required placeholder="Ej: iarita@gmail.com"></div>
                <div class="form-group"><label>Teléfono / WhatsApp</label><input type="tel" id="telefonoCliente" required placeholder="Ej: 1166788997"></div>
                <div class="form-group"><label>Zona de Envío / Provincia</label>
                    <select id="provinciaCliente" class="payment-select">
                        <option value="CABA">Capital Federal (CABA) - $8.500</option>
                        <option value="Buenos Aires" selected>Provincia de Buenos Aires - $12.500</option>
                        <option value="Provincias">Otras Provincias / Resto del País - $18.500</option>
                    </select>
                </div>
                <div class="form-group"><label>Dirección de Entrega</label><input type="text" id="direccionCliente" required placeholder="Ej: Calletin 78"></div>
                <div class="form-group"><label>Código Postal</label><input type="text" id="cpCliente" required placeholder="Ej: 1789"></div>
                
                <div class="form-buttons">
                    <button type="button" class="btn-back" onclick="volverAlCarrito()">Volver</button>
                    <button type="submit" class="btn-submit-order">💬 Enviar Pedido x WhatsApp</button>
                </div>
            </form>
        `;
    }
}

function procederAlCheckout() {
    if (carrito.length === 0) return;
    vistaActual = 'checkout';
    renderizarContenidoDrawer();
}

function volverAlCarrito() {
    vistaActual = 'carrito';
    renderizarContenidoDrawer();
}

function enviarOrdenWhatsApp(event) {
    event.preventDefault();
    const nombre = document.getElementById('nombreCliente').value;
    const dni = document.getElementById('dniCliente').value;
    const email = document.getElementById('emailCliente').value;
    const telefono = document.getElementById('telefonoCliente').value;
    const provKey = document.getElementById('provinciaCliente').value;
    const direccion = document.getElementById('direccionCliente').value;
    const cp = document.getElementById('cpCliente').value;

    const tarifaEnvio = tarifasProvincias[provKey] || tarifasProvincias["Provincias"];
    const { subtotal, descuento, recargo, total, valorCuota } = calcularTotales();
    const costoEnvio = tarifaEnvio.costo;
    const totalFinal = total + costoEnvio;
    const codigoSeguimiento = generarCodigoSeguimiento11Digitos();

    let nombreMetodo = "Transferencia Bancaria";
    if (metodoPagoGlobal === 'creditoDni') nombreMetodo = "Crédito con DNI (+5.5% por pago)";
    if (metodoPagoGlobal === 'tarjetaCredito') nombreMetodo = "Tarjeta de Crédito (+8% por pago)";

    let mensaje = `*N° de Seguimiento: ${codigoSeguimiento}*\n\n`;
    mensaje += `*DATOS DEL COMPRADOR*\n`;
    mensaje += `• Nombre: ${nombre}\n`;
    mensaje += `• DNI/CUIL: ${dni}\n`;
    mensaje += `• Teléfono: ${telefono}\n`;
    mensaje += `• Email: ${email}\n`;
    mensaje += `• Dirección: ${direccion}\n`;
    mensaje += `• Provincia: ${provKey}\n`;
    mensaje += `• Código Postal: ${cp}\n`;
    mensaje += `• Zona de Envío: ${tarifaEnvio.nombre}\n`;
    mensaje += `• Costo de envío: ${formatearMoneda(costoEnvio)}\n`;
    mensaje += `• Demora estimada: ${tarifaEnvio.demora}\n\n`;

    mensaje += `*PRODUCTOS SOLICITADOS*\n`;
    carrito.forEach(item => {
        mensaje += `• ${item.cantidad}x ${item.nombre} — ${formatearMoneda(item.precioOferta * item.cantidad)}\n`;
    });

    mensaje += `\n*DESGLOSE DE PAGOS Y ENVÍO*\n`;
    mensaje += `• Subtotal: ${formatearMoneda(subtotal)}\n`;
    mensaje += `• Envío: ${formatearMoneda(costoEnvio)}\n`;
    mensaje += `• Recargo/Descuento: ${descuento > 0 ? '-' + formatearMoneda(descuento) : (recargo > 0 ? '+' + formatearMoneda(recargo) : '$ 0')}\n`;
    mensaje += `• Método: ${nombreMetodo}\n`;
    mensaje += `• Forma de pago: ${cuotasGlobal} ${cuotasGlobal === 1 ? 'Pago único' : 'cuotas de ' + formatearMoneda(valorCuota) + ' c/u'}\n\n`;

    mensaje += `*TOTAL A PAGAR: ${formatearMoneda(totalFinal)}*\n`;
    mensaje += `• Primera cuota: ${formatearMoneda(valorCuota)}\n`;
    mensaje += `• Cuotas a abonar por mes: ${cuotasGlobal} ${cuotasGlobal === 1 ? 'cuota' : 'cuotas'} de ${formatearMoneda(valorCuota)}\n\n`;

    mensaje += `*CÓDIGO DE SEGUIMIENTO*\n`;
    mensaje += `${codigoSeguimiento}`;

    const numeroWhatsApp = "541155012447"; 
    const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensaje)}`;
    window.open(url, '_blank');
}

document.addEventListener('DOMContentLoaded', () => {
    renderizarProductos();
    actualizarContadorCarrito();
});
</script>
</body>
</html>
