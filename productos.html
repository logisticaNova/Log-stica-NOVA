<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logística Nova - Catálogo y Orden de Compra</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --primary-color: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --accent-color: #f97316;
    --accent-light: #fff7ed;
    --success-color: #10b981;
    --success-dark: #059669;
    --text-main: #111827;
    --text-secondary: #374151;
    --text-muted: #6b7280;
    --bg-body: #f6f8fb;
    --bg-card: #ffffff;
    --bg-soft: #f8fafc;
    --border-color: #e5e7eb;
    --border-light: #eef0f3;
    --radius: 14px;
    --transition: all 0.25s ease;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(180deg, #f8fafc 0%, #f3f5f9 100%);
    color: var(--text-main);
    line-height: 1.5;
    padding-bottom: 60px;
    overflow-x: hidden;
}

.navbar {
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-light);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 13px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar-brand {
    font-size: 1.08rem;
    font-weight: 800;
    color: var(--primary-color);
    letter-spacing: -0.3px;
}

.cart-btn {
    background: var(--primary-color);
    color: white;
    border: none;
    padding: 9px 15px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 0.86rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: var(--transition);
    box-shadow: 0 3px 8px rgba(37,99,235,0.18);
}

.cart-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: 0 5px 12px rgba(37,99,235,0.25);
}

.cart-badge {
    background: var(--accent-color);
    color: white;
    min-width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    padding: 2px 5px;
    font-size: 0.7rem;
    font-weight: 800;
}

header {
    text-align: center;
    margin: 42px 0 28px;
    padding: 0 16px;
}

.header-kicker {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--primary-light);
    color: var(--primary-color);
    border: 1px solid #dbeafe;
    padding: 6px 11px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.45px;
    margin-bottom: 13px;
}

header h1 {
    font-size: clamp(1.9rem, 4vw, 2.65rem);
    color: var(--text-main);
    margin-bottom: 9px;
    font-weight: 800;
    letter-spacing: -1px;
}

header p {
    color: var(--text-muted);
    font-size: 0.92rem;
    max-width: 620px;
    margin: 0 auto;
}

.header-highlight {
    color: var(--accent-color);
    font-weight: 700;
}

.container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 18px;
}

.filtros-wrapper {
    margin-bottom: 28px;
}

.filtros {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 9px;
    scrollbar-width: thin;
    scrollbar-color: #d1d5db transparent;
    -webkit-overflow-scrolling: touch;
}

.filtros::-webkit-scrollbar {
    height: 4px;
}

.filtros::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 20px;
}

.filter-btn {
    flex: 0 0 auto;
    background: rgba(255,255,255,0.9);
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    padding: 8px 15px;
    border-radius: 22px;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
    font-size: 0.8rem;
    transition: var(--transition);
}

.filter-btn:hover {
    border-color: #bfdbfe;
    color: var(--primary-color);
    background: #fff;
}

.filter-btn.active {
    background: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
    box-shadow: 0 3px 8px rgba(37,99,235,0.18);
}

.grid-productos {
    display: grid;
    grid-template-columns: repeat(1, minmax(0, 1fr));
    gap: 20px;
}

.card {
    background: var(--bg-card);
    border-radius: var(--radius);
    border: 1px solid var(--border-color);
    box-shadow: 0 2px 5px rgba(15,23,42,0.035);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    position: relative;
}

.card:hover {
    transform: translateY(-3px);
    border-color: #dbe3ef;
    box-shadow: 0 10px 25px rgba(15,23,42,0.075);
}

.badge-stock {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(255,255,255,0.92);
    color: #047857;
    border: 1px solid #a7f3d0;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 4px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.35px;
    z-index: 10;
    box-shadow: 0 2px 7px rgba(0,0,0,0.06);
}

.product-gallery-container {
    padding: 14px;
    background: #fafafa;
    border-bottom: 1px solid var(--border-light);
}

.main-image-container {
    width: 100%;
    height: 220px;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 10px;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px solid #e2e8f0;
}

.main-image-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.3s ease, transform 0.4s ease;
}

.card:hover .main-image-container img {
    transform: scale(1.025);
}

.thumbnails-container {
    display: flex;
    gap: 8px;
    justify-content: center;
    width: 100%;
    overflow-x: auto;
    padding-bottom: 2px;
}

.thumbnail {
    width: 52px;
    height: 52px;
    border-radius: 6px;
    object-fit: cover;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s ease;
    background: #fff;
}

.thumbnail:hover, .thumbnail.active {
    border-color: var(--primary-color);
    transform: scale(1.05);
}

.card-body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.card-category {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--primary-color);
    font-weight: 800;
    margin-bottom: 6px;
}

.card-title {
    font-size: 1.03rem;
    font-weight: 750;
    color: var(--text-main);
    margin-bottom: 9px;
    line-height: 1.35;
    letter-spacing: -0.2px;
}

.card-desc {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-bottom: 15px;
    line-height: 1.55;
    min-height: 55px;
}

.ver-mas-btn {
    border: none;
    background: transparent;
    color: var(--primary-color);
    font-weight: 750;
    font-size: 0.76rem;
    cursor: pointer;
    padding: 0;
    margin-left: 4px;
}

.specs-list {
    background: linear-gradient(135deg, #f8fafc, #f9fafb);
    border: 1px solid var(--border-light);
    border-radius: 9px;
    padding: 10px 11px;
    margin-bottom: 16px;
    font-size: 0.77rem;
}

.specs-list div {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    gap: 12px;
}

.specs-list div:last-child { margin-bottom: 0; }

.spec-label { color: var(--text-muted); font-weight: 500; }
.spec-value { color: var(--text-secondary); font-weight: 700; text-align: right; }

.pricing {
    margin-top: auto;
    border-top: 1px solid var(--border-light);
    padding-top: 15px;
}

.price-container {
    display: flex;
    align-items: baseline;
    gap: 9px;
    margin-bottom: 5px;
}

.price-offer {
    font-size: 1.42rem;
    font-weight: 800;
    color: var(--text-main);
    letter-spacing: -0.5px;
}

.cuotas-badge {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    font-size: 0.72rem;
    color: var(--accent-color);
    background: var(--accent-light);
    border: 1px solid #fed7aa;
    border-radius: 6px;
    padding: 5px 8px;
    font-weight: 750;
    margin-top: 3px;
    margin-bottom: 12px;
}

.btn-add-cart {
    width: 100%;
    background: linear-gradient(135deg, var(--primary-color), #3b82f6);
    color: white;
    border: none;
    padding: 11px 12px;
    border-radius: 9px;
    font-weight: 750;
    font-size: 0.84rem;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: 0 3px 8px rgba(37,99,235,0.14);
}

.btn-add-cart:hover {
    background: linear-gradient(135deg, var(--primary-dark), #2563eb);
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(37,99,235,0.2);
}

.paginacion {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin: 34px 0 12px;
}

.paginacion button {
    min-width: 38px;
    height: 38px;
    padding: 0 11px;
    border: 1px solid var(--border-color);
    background: white;
    color: var(--text-secondary);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
}

.paginacion button:hover:not(:disabled) {
    border-color: #bfdbfe;
    color: var(--primary-color);
    background: #f8fbff;
}

.paginacion button.active {
    background: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
    box-shadow: 0 3px 8px rgba(37,99,235,0.18);
}

.paginacion button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(15,23,42,0.48);
    display: flex;
    justify-content: flex-end;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
}

.modal-overlay.active {
    opacity: 1;
    visibility: visible;
}

.cart-drawer {
    background-color: white;
    width: 100%;
    max-width: 480px;
    height: 100%;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.3s ease;
}

.modal-overlay.active .cart-drawer {
    transform: translateX(0);
}

.cart-header {
    padding: 16px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.close-cart {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--text-muted);
}

.cart-body {
    padding: 16px;
    overflow-y: auto;
    flex-grow: 1;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-color);
}

.cart-item-info {
    flex: 1;
    min-width: 0;
}

.cart-item-info h4 { font-size: 0.9rem; margin-bottom: 2px; }
.cart-item-price { font-size: 0.8rem; color: var(--text-muted); }

.cart-item-actions {
    display: flex;
    align-items: center;
    gap: 6px;
}

.qty-btn {
    background-color: var(--bg-body);
    border: 1px solid var(--border-color);
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
}

.remove-btn {
    background: none;
    border: none;
    color: #ef4444;
    cursor: pointer;
    font-size: 0.8rem;
    margin-left: 6px;
}

.payment-methods {
    margin-bottom: 10px;
}

.payment-methods label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 3px;
}

.payment-select {
    width: 100%;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background-color: white;
    font-family: inherit;
    font-size: 0.9rem;
}

.cart-summary-line {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
    font-size: 0.83rem;
}

.cart-total {
    display: flex;
    justify-content: space-between;
    font-size: 1.05rem;
    font-weight: 700;
    margin: 10px 0 5px;
    color: var(--text-main);
}

.installment-summary {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    padding: 9px 10px;
    margin-bottom: 10px;
    color: #1e40af;
    font-size: 0.8rem;
}

.checkout-btn {
    width: 100%;
    background-color: #10b981;
    color: white;
    border: none;
    padding: 11px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
}

.checkout-btn:hover { background-color: #059669; }

.form-group {
    margin-bottom: 10px;
}

.form-group label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 3px;
    color: var(--text-main);
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 9px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
}

.inline-group {
    display: flex;
    gap: 10px;
}

.inline-group > div {
    flex: 1;
}

.form-buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.btn-back {
    background-color: var(--text-muted);
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    width: 35%;
}

.btn-submit-order {
    background-color: #25d366;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    width: 65%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 0.9rem;
}

.btn-submit-order:hover { background-color: #128c7e; }

.empty-cart {
    text-align: center;
    color: var(--text-muted);
    margin-top: 30px;
}

@media (min-width: 640px) {
    .grid-productos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
}
@media (min-width: 960px) {
    .grid-productos { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
}
@media (min-width: 1200px) {
    .grid-productos { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; }
    .container { padding: 0 20px; }
}
</style>
</head>

<div class="grid-productos" id="gridProductos"></div>

    </div>
</div>

let carrito = [];
let vistaActual = 'carrito';
let metodoPagoGlobal = 'transferencia';
let cuotasGlobal = 1;
let categoriaSeleccionada = 'Todas';
let localidadSeleccionadaGlobal = 'CABA';
const PRODUCTOS_POR_PAGINA = 12;
let paginaActual = 1;

function formatearMoneda(valor) {
    return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(valor);
}

function generarCodigoSeguimiento11Digitos() {
    let codigo = "NV-";
    for (let i = 0; i < 7; i++) {
        codigo += Math.floor(Math.random() * 10);
    }
    return codigo;
}

function filtrarCategoria(categoria, botonElemento) {
    categoriaSeleccionada = categoria;
    paginaActual = 1;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    botonElemento.classList.add('active');
    renderizarProductos();
}

function cambiarImagenMiniatura(productoId, srcImagen, elementoThumbnail) {
    const imagenPrincipal = document.getElementById(`mainImage-${productoId}`);
    if (imagenPrincipal) {
        imagenPrincipal.src = srcImagen;
    }
    
    const contenedorMiniaturas = elementoThumbnail.parentElement;
    contenedorMiniaturas.querySelectorAll('.thumbnail').forEach(thumb => thumb.classList.remove('active'));
    elementoThumbnail.classList.add('active');
}

function alternarDescripcion(id, descripcionCompleta) {
    const textoElemento = document.getElementById(`descripcion-${id}`);
    const boton = document.getElementById(`verMas-${id}`);
    if (!textoElemento || !boton) return;

    const estaExpandido = boton.getAttribute('data-expandido') === 'true';

    if (estaExpandido) {
        textoElemento.innerText = recortarTextoLimpio(descripcionCompleta, 50);
        boton.innerText = 'Ver más';
        boton.setAttribute('data-expandido', 'false');
    } else {
        textoElemento.innerText = descripcionCompleta;
        boton.innerText = 'Ver menos';
        boton.setAttribute('data-expandido', 'true');
    }
}

function recortarTextoLimpio(texto, limite) {
    if (texto.length <= limite) return texto;
    const sub = texto.substring(0, limite);
    const ultimoEspacio = sub.lastIndexOf(' ');
    if (ultimoEspacio > 20) {
        return sub.substring(0, ultimoEspacio) + '...';
    }
    return sub + '...';
}

function renderizarProductos() {
    const gridContainer = document.getElementById('gridProductos');
    const paginacionContainer = document.getElementById('paginacion');
    gridContainer.innerHTML = '';
    paginacionContainer.innerHTML = '';

    const productosFiltrados = categoriaSeleccionada === 'Todas'
        ? productos
        : productos.filter(p => p.categoria.toLowerCase() === categoriaSeleccionada.toLowerCase());

    if (productosFiltrados.length === 0) {
        gridContainer.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:30px;">No hay productos disponibles en esta categoría.</div>`;
        return;
    }

    const totalPaginas = Math.ceil(productosFiltrados.length / PRODUCTOS_POR_PAGINA);
    if (paginaActual > totalPaginas) paginaActual = totalPaginas;
    if (paginaActual < 1) paginaActual = 1;

    const inicio = (paginaActual - 1) * PRODUCTOS_POR_PAGINA;
    const fin = inicio + PRODUCTOS_POR_PAGINA;
    const productosPagina = productosFiltrados.slice(inicio, fin);

    productosPagina.forEach(producto => {
        let specsHTML = '';
        for (const [key, value] of Object.entries(producto.especificaciones)) {
            const etiqueta = key.replace(/([A-Z])/g, ' $1').replace(/^./, letra => letra.toUpperCase());
            specsHTML += `<div><span class="spec-label">${etiqueta}:</span><span class="spec-value">${value}</span></div>`;
        }

        const imagenes = producto.imagenes.filter(img => img && img.trim() !== '').slice(0, 5);
        const imagenPrincipalInicial = imagenes.length > 0 ? imagenes[0] : '';

        let thumbnailsHTML = '';
        imagenes.forEach((imgSrc, index) => {
            thumbnailsHTML += `<img src="${imgSrc}" alt="${producto.nombre} - Vista ${index + 1}" class="thumbnail ${index === 0 ? 'active' : ''}" onclick="cambiarImagenMiniatura(${producto.id}, '${imgSrc}', this)">`;
        });

        const superaLimite = producto.descripcion.length > 50;
        const descripcionInicial = recortarTextoLimpio(producto.descripcion, 50);

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            ${producto.stock ? '<span class="badge-stock">✓ Stock</span>' : ''}
            
            <div class="product-gallery-container">
                <div class="main-image-container">
                    <img id="mainImage-${producto.id}" src="${imagenPrincipalInicial}" alt="${producto.nombre}" loading="lazy" onerror="this.style.display='none'">
                </div>
                <div class="thumbnails-container">
                    ${thumbnailsHTML}
                </div>
            </div>

            <div class="card-body">
                <span class="card-category">${producto.marca} · ${producto.categoria}</span>
                <h3 class="card-title">${producto.nombre}</h3>
                <p class="card-desc">
                    <span id="descripcion-${producto.id}">${descripcionInicial}</span>
                    ${superaLimite ? `<button id="verMas-${producto.id}" class="ver-mas-btn" data-expandido="false" onclick="alternarDescripcion(${producto.id}, '${producto.descripcion.replace(/'/g, "\\'")}')">Ver más</button>` : ''}
                </p>
                <div class="specs-list">${specsHTML}</div>
                <div class="pricing">
                    <div class="price-container">
                        <span class="price-offer">${formatearMoneda(producto.precioOferta)}</span>
                    </div>
                    <div class="cuotas-badge">⚡ Abonando por transferencia 15% OFF</div>
                    <button class="btn-add-cart" onclick="agregarAlCarrito(${producto.id})">Agregar al Carrito</button>
                </div>
            </div>
        `;
        gridContainer.appendChild(card);
    });

    if (totalPaginas > 1) {
        for (let i = 1; i <= totalPaginas; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            if (i === paginaActual) btn.classList.add('active');
            btn.onclick = () => {
                paginaActual = i;
                renderizarProductos();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            paginacionContainer.appendChild(btn);
        }
    }
}

function agregarAlCarrito(id) {
    const producto = productos.find(p => p.id === id);
    if (!producto) return;
    const itemExistente = carrito.find(item => item.id === id);
    if (itemExistente) {
        itemExistente.cantidad++;
    } else {
        carrito.push({ ...producto, cantidad: 1 });
    }
    actualizarContadorCarrito();
    vistaActual = 'carrito';
    toggleCart(true);
}

function cambiarCantidad(id, cambio) {
    const item = carrito.find(i => i.id === id);
    if (item) {
        item.cantidad += cambio;
        if (item.cantidad <= 0) {
            carrito = carrito.filter(i => i.id !== id);
        }
    }
    actualizarContadorCarrito();
    renderizarContenidoDrawer();
}

function eliminarDelCarrito(id) {
    carrito = carrito.filter(i => i.id !== id);
    actualizarContadorCarrito();
    renderizarContenidoDrawer();
}

function actualizarContadorCarrito() {
    const totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
    document.getElementById('cartCount').innerText = totalItems;
}

function toggleCart(forceOpen = false) {
    const modal = document.getElementById('cartModal');
    if (forceOpen) {
        modal.classList.add('active');
    } else {
        modal.classList.toggle('active');
        if (!modal.classList.contains('active')) {
            vistaActual = 'carrito';
        }
    }
    renderizarContenidoDrawer();
}

function handleOutsideClick(event) {
    if (event.target.id === 'cartModal') {
        toggleCart();
    }
}

function onPaymentMethodChange() {
    const select = document.getElementById('paymentMethodSelect');
    if (!select) return;
    metodoPagoGlobal = select.value;
    cuotasGlobal = 1; 
    renderizarContenidoDrawer();
}

function onCuotasChange() {
    const select = document.getElementById('cuotasSelect');
    if (select) cuotasGlobal = parseInt(select.value) || 1;
    renderizarContenidoDrawer();
}

function onLocalidadSelectChange() {
    const select = document.getElementById('localidadEnvioSelect');
    if (select) {
        localidadSeleccionadaGlobal = select.value;
    }
}

function calcularTotales() {
    let subtotal = carrito.reduce((sum, item) => sum + (item.precioOferta * item.cantidad), 0);
    let descuento = 0;
    let recargoTotal = 0;
    let total = subtotal;

    if (metodoPagoGlobal === 'transferencia') {
        descuento = subtotal * 0.15;
        total = subtotal - descuento;
    } else if (metodoPagoGlobal === 'creditoDni') {
        const recargoPorcentaje = 0.04 * cuotasGlobal;
        recargoTotal = subtotal * recargoPorcentaje;
        total = subtotal + recargoTotal;
    } else if (metodoPagoGlobal === 'tarjetaCredito') {
        const recargoPorcentaje = 0.06 * cuotasGlobal;
        recargoTotal = subtotal * recargoPorcentaje;
        total = subtotal + recargoTotal;
    }
    
    const costoEnvio = tarifasProvincias[localidadSeleccionadaGlobal]?.costo || 0;
    total += costoEnvio;
    
    const valorCuota = cuotasGlobal > 0 ? total / cuotasGlobal : total;

    return { subtotal, descuento, recargoTotal, costoEnvio, total, valorCuota };
}

function renderizarContenidoDrawer() {
    const bodyContent = document.getElementById('cartBodyContent');
    const drawerTitle = document.getElementById('drawerTitle');
    if (!bodyContent) return;

    if (carrito.length === 0) {
        drawerTitle.innerText = "Tu Carrito de Compras";
        bodyContent.innerHTML = `
            <div class="empty-cart">
                <p>Tu carrito está vacío.</p>
                <button class="cart-btn" style="margin: 20px auto;" onclick="toggleCart()">Ver Catálogo</button>
            </div>
        `;
        return;
    }

    if (vistaActual === 'carrito') {
        drawerTitle.innerText = "Tu Carrito de Compras";
        let itemsHTML = '';
        carrito.forEach(item => {
            itemsHTML += `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <h4>${item.nombre}</h4>
                        <div class="cart-item-price">${formatearMoneda(item.precioOferta)} x ${item.cantidad}</div>
                    </div>
                    <div class="cart-item-actions">
                        <button class="qty-btn" onclick="cambiarCantidad(${item.id}, -1)">-</button>
                        <span>${item.cantidad}</span>
                        <button class="qty-btn" onclick="cambiarCantidad(${item.id}, 1)">+</button>
                        <button class="remove-btn" onclick="eliminarDelCarrito(${item.id})">🗑️</button>
                    </div>
                </div>
            `;
        });

        const { subtotal, descuento, recargoTotal, total, valorCuota } = calcularTotales();

        let opcionesCuotasHTML = '';
        if (metodoPagoGlobal === 'creditoDni' || metodoPagoGlobal === 'tarjetaCredito') {
            [1, 3, 6, 9, 12].forEach(c => {
                opcionesCuotasHTML += `<option value="${c}" ${cuotasGlobal === c ? 'selected' : ''}>${c} ${c === 1 ? 'Pago' : 'Pagos'}</option>`;
            });
        }

        bodyContent.innerHTML = `
            <div style="margin-bottom: 15px;">${itemsHTML}</div>

            <div class="payment-methods" style="margin-top: 15px;">
                <label>Método de Pago:</label>
                <select id="paymentMethodSelect" class="payment-select" onchange="onPaymentMethodChange()">
                    <option value="transferencia" ${metodoPagoGlobal === 'transferencia' ? 'selected' : ''}>Transferencia Bancaria (15% OFF)</option>
                    <option value="creditoDni" ${metodoPagoGlobal === 'creditoDni' ? 'selected' : ''}>Cuenta DNI</option>
                    <option value="tarjetaCredito" ${metodoPagoGlobal === 'tarjetaCredito' ? 'selected' : ''}>Tarjeta de Crédito</option>
                </select>
            </div>

            ${(metodoPagoGlobal === 'creditoDni' || metodoPagoGlobal === 'tarjetaCredito') ? `
                <div class="form-group">
                    <label>Cantidad de Pagos (Cuotas):</label>
                    <select id="cuotasSelect" class="payment-select" onchange="onCuotasChange()">
                        ${opcionesCuotasHTML}
                    </select>
                </div>
            ` : ''}

            <div style="border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 15px;">
                <div class="cart-summary-line"><span>Subtotal productos:</span><span>${formatearMoneda(subtotal)}</span></div>
                ${descuento > 0 ? `<div class="cart-summary-line" style="color:var(--success-dark)"><span>Descuento Transferencia (15%):</span><span>-${formatearMoneda(descuento)}</span></div>` : ''}
                ${recargoTotal > 0 ? `<div class="cart-summary-line" style="color:var(--accent-color)"><span>Recargo Financiamiento:</span><span>+${formatearMoneda(recargoTotal)}</span></div>` : ''}
                <div class="cart-total"><span>Subtotal a pagar:</span><span>${formatearMoneda(subtotal - descuento + recargoTotal)}</span></div>
                ${cuotasGlobal > 1 ? `<div class="installment-summary">Pagás en <strong>${cuotasGlobal} pagos</strong> de <strong>${formatearMoneda(valorCuota)}</strong> (incluyendo envío estimado)</div>` : ''}
            </div>

            <button class="checkout-btn" style="margin-top: 15px;" onclick="vistaActual = 'formulario'; renderizarContenidoDrawer();">Continuar con Datos y Envío</button>
        `;
    } else if (vistaActual === 'formulario') {
        drawerTitle.innerText = "Datos Personales y Envío";
        bodyContent.innerHTML = `
            <form id="orderForm" onsubmit="enviarOrdenWhatsApp(event)">
                <div class="form-group">
                    <label>Nombre y Apellido *</label>
                    <input type="text" id="nombreCliente" required placeholder="Ej. Juan Pérez">
                </div>
                <div class="form-group">
                    <label>Teléfono / WhatsApp *</label>
                    <input type="tel" id="telCliente" required placeholder="Ej. 1123456789">
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="emailCliente" placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label>Dirección de Entrega (Calle y Nro) *</label>
                    <input type="text" id="dirCliente" required placeholder="Av. Corrientes 1234, Piso 2">
                </div>
                
                <div class="inline-group">
                    <div class="form-group">
                        <label>Localidad / Ciudad *</label>
                        <input type="text" id="ciudadCliente" required placeholder="Ej. Mar del Plata">
                    </div>
                    <div class="form-group">
                        <label>Código Postal *</label>
                        <input type="text" id="cpCliente" required placeholder="Ej. 7600">
                    </div>
                </div>

                <div class="form-group">
                    <label>Zona de Destino / Envío *</label>
                    <select id="localidadEnvioSelect" class="payment-select" onchange="onLocalidadSelectChange()">
                        <option value="CABA" ${localidadSeleccionadaGlobal === 'CABA' ? 'selected' : ''}>CABA ($8.500 - 12 a 24 hs)</option>
                        <option value="Buenos Aires" ${localidadSeleccionadaGlobal === 'Buenos Aires' ? 'selected' : ''}>Buenos Aires ($12.500 - 24 a 48 hs)</option>
                        <option value="Provincias" ${localidadSeleccionadaGlobal === 'Provincias' ? 'selected' : ''}>Otras Provincias ($18.500 - 3 a 6 días)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Observaciones / Comentarios</label>
                    <textarea id="obsCliente" rows="2" placeholder="Timbre roto, dejar en recepción, etc."></textarea>
                </div>

                <div class="form-buttons">
                    <button type="button" class="btn-back" onclick="vistaActual = 'carrito'; renderizarContenidoDrawer();">Volver</button>
                    <button type="submit" class="btn-submit-order">💬 Enviar a WhatsApp</button>
                </div>
            </form>
        `;
    }
}

function enviarOrdenWhatsApp(event) {
    event.preventDefault();
    const nombre = document.getElementById('nombreCliente').value;
    const tel = document.getElementById('telCliente').value;
    const email = document.getElementById('emailCliente').value || "No especificado";
    const dir = document.getElementById('dirCliente').value;
    const ciudad = document.getElementById('ciudadCliente').value;
    const cp = document.getElementById('cpCliente').value;
    const obs = document.getElementById('obsCliente').value || "Ninguna";

    const codigoSeguimiento = generarCodigoSeguimiento11Digitos();
    const { subtotal, descuento, recargoTotal, costoEnvio, total, valorCuota } = calcularTotales();
    const infoEnvio = tarifasProvincias[localidadSeleccionadaGlobal];

    let detalleProductos = "";
    carrito.forEach((item, index) => {
        detalleProductos += `*${index + 1}.* ${item.nombre} (SKU: ${item.sku}) - Cant: ${item.cantidad} - Subtotal: ${formatearMoneda(item.precioOferta * item.cantidad)}\n`;
    });

    let textoMetodoPago = metodoPagoGlobal === 'transferencia' ? "Transferencia Bancaria (15% OFF)" : (metodoPagoGlobal === 'creditoDni' ? `Cuenta DNI (${cuotasGlobal} pagos)` : `Tarjeta de Crédito (${cuotasGlobal} pagos)`);

    let mensaje = `📦 *NUEVA ORDEN DE COMPRA - LOGÍSTICA NOVA*\n`;
    mensaje += `🆔 *Seguimiento:* ${codigoSeguimiento}\n\n`;
    mensaje += `👤 *CLIENTE*\n`;
    mensaje += `• Nombre: ${nombre}\n`;
    mensaje += `• Teléfono: ${tel}\n`;
    mensaje += `• Email: ${email}\n\n`;
    mensaje += `📍 *ENVÍO*\n`;
    mensaje += `• Dirección: ${dir}, ${ciudad} (CP: ${cp})\n`;
    mensaje += `• Zona de Envío: ${infoEnvio.nombre} (${formatearMoneda(costoEnvio)} - Demora: ${infoEnvio.demora})\n\n`;
    mensaje += `🛒 *PRODUCTOS*\n`;
    mensaje += `${detalleProductos}\n`;
    mensaje += `💳 *PAGO*\n`;
    mensaje += `• Método: ${textoMetodoPago}\n`;
    if (cuotasGlobal > 1) {
        mensaje += `• Valor Cuota (incluye envío): ${formatearMoneda(valorCuota)}\n`;
    }
    mensaje += `• Subtotal: ${formatearMoneda(subtotal)}\n`;
    if (descuento > 0) mensaje += `• Descuento: -${formatearMoneda(descuento)}\n`;
    if (recargoTotal > 0) mensaje += `• Recargo: +${formatearMoneda(recargoTotal)}\n`;
    mensaje += `• Costo Envío: ${formatearMoneda(costoEnvio)}\n`;
    mensaje += `💰 *TOTAL FINAL:* ${formatearMoneda(total)}\n\n`;
    mensaje += `📝 *Observaciones:* ${obs}\n\n`;
    mensaje += `Hola, ya elegí mi producto y me gustaría avanzar con la compra. ¿Me pasarías el alias o CBU y los datos bancarios para realizar el pago?`;

    const numeroWhatsAppDestino = "5491155012447";
    const urlWhatsApp = `https://api.whatsapp.com/send?phone=${numeroWhatsAppDestino}&text=${encodeURIComponent(mensaje)}`;

    window.open(urlWhatsApp, '_blank');
}

// Inicializar la aplicación al cargar la página
window.onload = () => {
    renderizarProductos();
    actualizarContadorCarrito();
};
</script>
