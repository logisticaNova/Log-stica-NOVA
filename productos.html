<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logística Nova - Catálogo y Orden de Compra</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --primary-color: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --accent-color: #f97316;
    --accent-light: #fff7ed;
    --success-color: #10b981;
    --success-dark: #059669;
    --text-main: #111827;
    --text-secondary: #374151;
    --text-muted: #6b7280;
    --bg-body: #f6f8fb;
    --bg-card: #ffffff;
    --bg-soft: #f8fafc;
    --border-color: #e5e7eb;
    --border-light: #eef0f3;
    --radius: 14px;
    --transition: all 0.25s ease;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', sans-serif;
    background:
        linear-gradient(
            180deg,
            #f8fafc 0%,
            #f3f5f9 100%
        );
    color: var(--text-main);
    line-height: 1.5;
    padding-bottom: 60px;
    overflow-x: hidden;
}

/* =========================================
NAVBAR
========================================= */

.navbar {
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-light);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 13px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar-brand {
    font-size: 1.08rem;
    font-weight: 800;
    color: var(--primary-color);
    letter-spacing: -0.3px;
}

.cart-btn {
    background: var(--primary-color);
    color: white;
    border: none;
    padding: 9px 15px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 0.86rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: var(--transition);
    box-shadow: 0 3px 8px rgba(37,99,235,0.18);
}

.cart-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: 0 5px 12px rgba(37,99,235,0.25);
}

.cart-badge {
    background: var(--accent-color);
    color: white;
    min-width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    padding: 2px 5px;
    font-size: 0.7rem;
    font-weight: 800;
}

/* =========================================
HEADER
========================================= */

header {
    text-align: center;
    margin: 42px 0 28px;
    padding: 0 16px;
}

.header-kicker {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--primary-light);
    color: var(--primary-color);
    border: 1px solid #dbeafe;
    padding: 6px 11px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.45px;
    margin-bottom: 13px;
}

header h1 {
    font-size: clamp(1.9rem, 4vw, 2.65rem);
    color: var(--text-main);
    margin-bottom: 9px;
    font-weight: 800;
    letter-spacing: -1px;
}

header p {
    color: var(--text-muted);
    font-size: 0.92rem;
    max-width: 620px;
    margin: 0 auto;
}

.header-highlight {
    color: var(--accent-color);
    font-weight: 700;
}

/* =========================================
CONTAINER
========================================= */

.container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 18px;
}

/* =========================================
FILTROS
========================================= */

.filtros-wrapper {
    margin-bottom: 28px;
}

.filtros {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 9px;
    scrollbar-width: thin;
    scrollbar-color: #d1d5db transparent;
    -webkit-overflow-scrolling: touch;
}

.filtros::-webkit-scrollbar {
    height: 4px;
}

.filtros::-webkit-scrollbar-track {
    background: transparent;
}

.filtros::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 20px;
}

.filter-btn {
    flex: 0 0 auto;
    background: rgba(255,255,255,0.9);
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    padding: 8px 15px;
    border-radius: 22px;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
    font-size: 0.8rem;
    transition: var(--transition);
}

.filter-btn:hover {
    border-color: #bfdbfe;
    color: var(--primary-color);
    background: #fff;
}

.filter-btn.active {
    background: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
    box-shadow: 0 3px 8px rgba(37,99,235,0.18);
}

/* =========================================
GRID
========================================= */

.grid-productos {
    display: grid;
    grid-template-columns: repeat(1, minmax(0, 1fr));
    gap: 20px;
}

/* =========================================
CARD
========================================= */

.card {
    background: var(--bg-card);
    border-radius: var(--radius);
    border: 1px solid var(--border-color);
    box-shadow: 0 2px 5px rgba(15,23,42,0.035);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
    position: relative;
}

.card:hover {
    transform: translateY(-3px);
    border-color: #dbe3ef;
    box-shadow: 0 10px 25px rgba(15,23,42,0.075);
}

/* =========================================
STOCK
========================================= */

.badge-stock {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(255,255,255,0.92);
    color: #047857;
    border: 1px solid #a7f3d0;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 4px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.35px;
    z-index: 10;
    box-shadow: 0 2px 7px rgba(0,0,0,0.06);
}

/* =========================================
PRODUCT IMAGE / CAROUSEL
========================================= */

.product-carousel {
    width: 100%;
    height: 245px;
    background:
        linear-gradient(
            145deg,
            #eef4ff 0%,
            #f8fafc 55%,
            #f1f5f9 100%
        );
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--border-light);
}

.carousel-track {
    width: 100%;
    height: 100%;
    position: relative;
}

.carousel-slide {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease;
}

.carousel-slide.active {
    opacity: 1;
    visibility: visible;
}

.carousel-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.45s ease;
}

.card:hover .carousel-slide.active img {
    transform: scale(1.025);
}

.carousel-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text-muted);
    font-size: 0.9rem;
    font-weight: 700;
}

/* =========================================
CAROUSEL BUTTONS
========================================= */

.carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    color: var(--text-main);
    font-size: 23px;
    line-height: 1;
    cursor: pointer;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 9px rgba(0,0,0,0.12);
    transition: var(--transition);
}

.carousel-btn:hover {
    background: white;
    transform: translateY(-50%) scale(1.07);
    color: var(--primary-color);
}

.carousel-prev {
    left: 11px;
}

.carousel-next {
    right: 11px;
}

/* =========================================
DOTS
========================================= */

.carousel-dots {
    position: absolute;
    bottom: 11px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 6px;
    z-index: 5;
}

.carousel-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.78);
    border: 1px solid rgba(0,0,0,0.13);
    cursor: pointer;
    transition: var(--transition);
    padding: 0;
}

.carousel-dot.active {
    background: var(--primary-color);
    transform: scale(1.3);
    border-color: var(--primary-color);
}

/* =========================================
CARD BODY
========================================= */

.card-body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.card-category {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--primary-color);
    font-weight: 800;
    margin-bottom: 6px;
}

.card-title {
    font-size: 1.03rem;
    font-weight: 750;
    color: var(--text-main);
    margin-bottom: 9px;
    line-height: 1.35;
    letter-spacing: -0.2px;
}

.card-desc {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-bottom: 15px;
    line-height: 1.55;
    min-height: 63px;
}

.descripcion-texto {
    display: inline;
}

.descripcion-texto.descripcion-corta {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.ver-mas-btn {
    border: none;
    background: transparent;
    color: var(--primary-color);
    font-weight: 750;
    font-size: 0.76rem;
    cursor: pointer;
    padding: 0;
    margin-left: 4px;
}

.ver-mas-btn:hover {
    text-decoration: underline;
}

/* =========================================
SPECS
========================================= */

.specs-list {
    background:
        linear-gradient(
            135deg,
            #f8fafc,
            #f9fafb
        );
    border: 1px solid var(--border-light);
    border-radius: 9px;
    padding: 10px 11px;
    margin-bottom: 16px;
    font-size: 0.77rem;
}

.specs-list div {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    gap: 12px;
}

.specs-list div:last-child {
    margin-bottom: 0;
}

.spec-label {
    color: var(--text-muted);
    font-weight: 500;
}

.spec-value {
    color: var(--text-secondary);
    font-weight: 700;
    text-align: right;
}

/* =========================================
PRICING
========================================= */

.pricing {
    margin-top: auto;
    border-top: 1px solid var(--border-light);
    padding-top: 15px;
}

.price-container {
    display: flex;
    align-items: baseline;
    gap: 9px;
    margin-bottom: 5px;
}

.price-offer {
    font-size: 1.42rem;
    font-weight: 800;
    color: var(--text-main);
    letter-spacing: -0.5px;
}

/* =========================================
TRANSFERENCIA
========================================= */

.cuotas-badge {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    font-size: 0.72rem;
    color: var(--accent-color);
    background: var(--accent-light);
    border: 1px solid #fed7aa;
    border-radius: 6px;
    padding: 5px 8px;
    font-weight: 750;
    margin-top: 3px;
    margin-bottom: 12px;
}

/* =========================================
ADD CART
========================================= */

.btn-add-cart {
    width: 100%;
    background:
        linear-gradient(
            135deg,
            var(--primary-color),
            #3b82f6
        );
    color: white;
    border: none;
    padding: 11px 12px;
    border-radius: 9px;
    font-weight: 750;
    font-size: 0.84rem;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: 0 3px 8px rgba(37,99,235,0.14);
}

.btn-add-cart:hover {
    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            #2563eb
        );
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(37,99,235,0.2);
}

.btn-add-cart:active {
    transform: translateY(0);
}

/* =========================================
PAGINACIÓN
========================================= */

.paginacion {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin: 34px 0 12px;
}

.paginacion button {
    min-width: 38px;
    height: 38px;
    padding: 0 11px;
    border: 1px solid var(--border-color);
    background: white;
    color: var(--text-secondary);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
}

.paginacion button:hover:not(:disabled) {
    border-color: #bfdbfe;
    color: var(--primary-color);
    background: #f8fbff;
}

.paginacion button.active {
    background: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
    box-shadow: 0 3px 8px rgba(37,99,235,0.18);
}

.paginacion button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.paginacion-info {
    width: 100%;
    text-align: center;
    margin-top: 7px;
    color: var(--text-muted);
    font-size: 0.76rem;
}

/* =========================================
CARRITO
========================================= */

.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(15,23,42,0.48);
    display: flex;
    justify-content: flex-end;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
}

.modal-overlay.active {
    opacity: 1;
    visibility: visible;
}

.cart-drawer {
    background-color: white;
    width: 100%;
    max-width: 480px;
    height: 100%;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.3s ease;
}

.modal-overlay.active .cart-drawer {
    transform: translateX(0);
}

.cart-header {
    padding: 16px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.close-cart {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--text-muted);
}

.cart-body {
    padding: 16px;
    overflow-y: auto;
    flex-grow: 1;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-color);
}

.cart-item-info {
    flex: 1;
    min-width: 0;
}

.cart-item-info h4 {
    font-size: 0.9rem;
    margin-bottom: 2px;
}

.cart-item-price {
    font-size: 0.8rem;
    color: var(--text-muted);
}

.cart-item-actions {
    display: flex;
    align-items: center;
    gap: 6px;
}

.qty-btn {
    background-color: var(--bg-body);
    border: 1px solid var(--border-color);
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
}

.remove-btn {
    background: none;
    border: none;
    color: #ef4444;
    cursor: pointer;
    font-size: 0.8rem;
    margin-left: 6px;
}

.payment-methods {
    margin-bottom: 12px;
}

.payment-methods label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 4px;
}

.payment-select {
    width: 100%;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background-color: white;
    font-family: inherit;
    font-size: 0.9rem;
}

.cart-summary-line {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 0.85rem;
}

.cart-total {
    display: flex;
    justify-content: space-between;
    font-size: 1.1rem;
    font-weight: 700;
    margin: 12px 0 6px;
    color: var(--text-main);
}

.installment-summary {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 12px;
    color: #1e40af;
    font-size: 0.82rem;
}

.checkout-btn {
    width: 100%;
    background-color: #10b981;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
}

.checkout-btn:hover {
    background-color: #059669;
}

.form-group {
    margin-bottom: 10px;
}

.form-group label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 3px;
    color: var(--text-main);
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 9px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: var(--primary-color);
}

.form-buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.btn-back {
    background-color: var(--text-muted);
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    width: 35%;
}

.btn-submit-order {
    background-color: #25d366;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    width: 65%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 0.9rem;
}

.btn-submit-order:hover {
    background-color: #128c7e;
}

.empty-cart {
    text-align: center;
    color: var(--text-muted);
    margin-top: 30px;
}

/* =========================================
RESPONSIVE
========================================= */

@media (min-width: 640px) {
    .grid-productos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
    }

    .product-carousel {
        height: 225px;
    }
}

@media (min-width: 960px) {
    .grid-productos {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
    }
}

@media (min-width: 1200px) {
    .grid-productos {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 22px;
    }

    .container {
        padding: 0 20px;
    }

    .product-carousel {
        height: 225px;
    }
}

@media (max-width: 480px) {
    .navbar {
        padding: 11px 14px;
    }

    .navbar-brand {
        font-size: 0.98rem;
    }

    .cart-btn {
        padding: 8px 11px;
    }

    header {
        margin: 30px 0 22px;
    }

    header h1 {
        letter-spacing: -0.7px;
    }

    .container {
        padding: 0 13px;
    }

    .filtros-wrapper {
        margin-bottom: 21px;
    }

    .grid-productos {
        gap: 16px;
    }

    .product-carousel {
        height: 215px;
    }

    .card-body {
        padding: 16px;
    }

    .card-desc {
        min-height: auto;
    }

    .price-offer {
        font-size: 1.35rem;
    }

    .btn-add-cart {
        padding: 12px;
        min-height: 45px;
    }

    .paginacion {
        gap: 5px;
    }

    .paginacion button {
        min-width: 36px;
        height: 36px;
        padding: 0 9px;
    }

    .cart-item {
        align-items: flex-start;
    }

    .cart-item-actions {
        flex-shrink: 0;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="navbar-brand">
        📦 Logística Nova
    </div>

    <button class="cart-btn" onclick="toggleCart()">
        🛒 Carrito
        <span class="cart-badge" id="cartCount">0</span>
    </button>
</nav>

<div class="container">

<header>
    <div class="header-kicker">
        ✦ Catálogo exclusivo
    </div>

    <h1>
        Catálogo de Productos
    </h1>

    <p>
        Encontrá productos seleccionados con
        <span class="header-highlight">
            precio especial por transferencia
        </span>
        y opciones de pago flexibles.
    </p>
</header>

<div class="filtros-wrapper">

    <div class="filtros">

        <button
            class="filter-btn active"
            onclick="filtrarCategoria('Todas', this)">
            Todas
        </button>

        <button
            class="filter-btn"
            onclick="filtrarCategoria('Celulares', this)">
            Celulares
        </button>

        <button
            class="filter-btn"
            onclick="filtrarCategoria('Gaming', this)">
            Gaming
        </button>

        <button
            class="filter-btn"
            onclick="filtrarCategoria('Televisores / Monitores', this)">
            Televisores / Monitores
        </button>

        <button
            class="filter-btn"
            onclick="filtrarCategoria('Aires Acondicionados', this)">
            Aires Acondicionados
        </button>

        <button
            class="filter-btn"
            onclick="filtrarCategoria('Heladeras / Freezers', this)">
            Heladeras / Freezers
        </button>

        <button
            class="filter-btn"
            onclick="filtrarCategoria('Cocinas / Hornos', this)">
            Cocinas / Hornos
        </button>

/* =========================================
VARIABLES
========================================= */

let carrito = [];

let vistaActual = 'carrito';

let metodoPagoGlobal = 'transferencia';

let cuotasGlobal = 1;

let categoriaSeleccionada = 'Todas';

let estadosCarrusel = {};

const PRODUCTOS_POR_PAGINA = 12;

let paginaActual = 1;


/* =========================================
UTILIDADES
========================================= */

function formatearMoneda(valor) {

    return new Intl.NumberFormat('es-AR', {
        style: 'currency',
        currency: 'ARS',
        maximumFractionDigits: 0
    }).format(valor);

}


function generarCodigoSeguimiento() {

    const caracteres =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let codigo = "NV-";

    for (let i = 0; i < 8; i++) {

        codigo += caracteres.charAt(
            Math.floor(
                Math.random() *
                caracteres.length
            )
        );

    }

    return codigo;
}


/* =========================================
FILTROS
========================================= */

function filtrarCategoria(categoria, botonElemento) {

    categoriaSeleccionada = categoria;

    paginaActual = 1;

    document
        .querySelectorAll('.filter-btn')
        .forEach(btn => {
            btn.classList.remove('active');
        });

    botonElemento.classList.add('active');

    renderizarProductos();
}


/* =========================================
CARRUSEL
========================================= */

function cambiarImagen(productoId, direccion) {

    const producto =
        productos.find(p => p.id === productoId);

    if (
        !producto ||
        !producto.imagenes.length
    ) {
        return;
    }

    if (!estadosCarrusel[productoId]) {
        estadosCarrusel[productoId] = 0;
    }

    const total = producto.imagenes.length;

    estadosCarrusel[productoId] =
        (
            estadosCarrusel[productoId] +
            direccion +
            total
        ) % total;

    actualizarCarrusel(productoId);
}


function irAImagen(productoId, indice) {

    estadosCarrusel[productoId] = indice;

    actualizarCarrusel(productoId);
}


function actualizarCarrusel(productoId) {

    const indice =
        estadosCarrusel[productoId] || 0;

    const slides =
        document.querySelectorAll(
            `.carousel-slide[data-producto="${productoId}"]`
        );

    const dots =
        document.querySelectorAll(
            `.carousel-dot[data-producto="${productoId}"]`
        );

    slides.forEach((slide, i) => {

        slide.classList.toggle(
            'active',
            i === indice
        );

    });

    dots.forEach((dot, i) => {

        dot.classList.toggle(
            'active',
            i === indice
        );

    });
}


/* =========================================
DESCRIPCIÓN
========================================= */

function alternarDescripcion(id) {

    const texto =
        document.getElementById(
            `descripcion-${id}`
        );

    const boton =
        document.getElementById(
            `verMas-${id}`
        );

    if (!texto || !boton) {
        return;
    }

    const expandido =
        texto.classList.contains('expandido');

    if (expandido) {

        texto.classList.remove('expandido');

        texto.classList.add(
            'descripcion-corta'
        );

        boton.innerText = 'Ver más';

    } else {

        texto.classList.remove(
            'descripcion-corta'
        );

        texto.classList.add('expandido');

        boton.innerText = 'Ver menos';
    }
}


/* =========================================
RENDER PRODUCTOS
========================================= */

function renderizarProductos() {

    const gridContainer =
        document.getElementById(
            'gridProductos'
        );

    const paginacionContainer =
        document.getElementById(
            'paginacion'
        );

    gridContainer.innerHTML = '';

    paginacionContainer.innerHTML = '';

    const productosFiltrados =
        categoriaSeleccionada === 'Todas'
            ? productos
            : productos.filter(
                p =>
                    p.categoria.toLowerCase() ===
                    categoriaSeleccionada.toLowerCase()
            );

    if (productosFiltrados.length === 0) {

        gridContainer.innerHTML = `
            <div style="
                grid-column:1/-1;
                text-align:center;
                color:var(--text-muted);
                padding:30px;
            ">
                No hay productos disponibles
                en esta categoría.
            </div>
        `;

        return;
    }

    const totalPaginas =
        Math.ceil(
            productosFiltrados.length /
            PRODUCTOS_POR_PAGINA
        );

    if (paginaActual > totalPaginas) {
        paginaActual = totalPaginas;
    }

    if (paginaActual < 1) {
        paginaActual = 1;
    }

    const inicio =
        (paginaActual - 1) *
        PRODUCTOS_POR_PAGINA;

    const fin =
        inicio +
        PRODUCTOS_POR_PAGINA;

    const productosPagina =
        productosFiltrados.slice(
            inicio,
            fin
        );

    productosPagina.forEach(producto => {

        if (
            estadosCarrusel[producto.id] ===
            undefined
        ) {
            estadosCarrusel[producto.id] = 0;
        }

        let specsHTML = '';

        for (
            const [key, value]
            of Object.entries(
                producto.especificaciones
            )
        ) {

            const etiqueta =
                key
                    .replace(
                        /([A-Z])/g,
                        ' $1'
                    )
                    .replace(
                        /^./,
                        letra =>
                            letra.toUpperCase()
                    );

            specsHTML += `
                <div>
                    <span class="spec-label">
                        ${etiqueta}:
                    </span>

                    <span class="spec-value">
                        ${value}
                    </span>
                </div>
            `;
        }

        let slidesHTML = '';
        let dotsHTML = '';

        const imagenes =
            producto.imagenes
                .filter(
                    img =>
                        img &&
                        img.trim() !== ''
                )
                .slice(0, 3);

        if (imagenes.length === 0) {

            slidesHTML = `
                <div class="carousel-slide active">
                    <div class="carousel-placeholder">
                        ${producto.marca}
                    </div>
                </div>
            `;

        } else {

            imagenes.forEach(
                (imagen, index) => {

                    slidesHTML += `
                        <div
                            class="carousel-slide ${
                                index === 0
                                    ? 'active'
                                    : ''
                            }"
                            data-producto="${producto.id}"
                        >
                            <img
                                src="${imagen}"
                                alt="${producto.nombre}"
                                loading="lazy"
                                onerror="this.style.display='none'"
                            >
                        </div>
                    `;

                    dotsHTML += `
                        <button
                            class="carousel-dot ${
                                index === 0
                                    ? 'active'
                                    : ''
                            }"
                            data-producto="${producto.id}"
                            onclick="irAImagen(
                                ${producto.id},
                                ${index}
                            )"
                            aria-label="Ver imagen ${
                                index + 1
                            }">
                        </button>
                    `;
                }
            );
        }

        const mostrarControles =
            imagenes.length > 1;

        const limiteDescripcion = 100;

        const descripcionLarga =
            producto.descripcion.length >
            limiteDescripcion;

        const descripcionCorta =
            descripcionLarga
                ? producto.descripcion.substring(
                    0,
                    limiteDescripcion
                ) + '...'
                : producto.descripcion;

        const card =
            document.createElement('div');

        card.className = 'card';

        card.innerHTML = `

            ${
                producto.stock
                    ? '<span class="badge-stock">✓ Stock</span>'
                    : ''
            }

            <div class="product-carousel">

                <div class="carousel-track">
                    ${slidesHTML}
                </div>

                ${
                    mostrarControles
                        ? `
                            <button
                                class="carousel-btn carousel-prev"
                                onclick="cambiarImagen(
                                    ${producto.id},
                                    -1
                                )"
                                aria-label="Imagen anterior">
                                ‹
                            </button>

                            <button
                                class="carousel-btn carousel-next"
                                onclick="cambiarImagen(
                                    ${producto.id},
                                    1
                                )"
                                aria-label="Imagen siguiente">
                                ›
                            </button>

                            <div class="carousel-dots">
                                ${dotsHTML}
                            </div>
                        `
                        : ''
                }

            </div>

            <div class="card-body">

                <span class="card-category">
                    ${producto.marca} · ${producto.categoria}
                </span>

                <h3 class="card-title">
                    ${producto.nombre}
                </h3>

                <p class="card-desc">

                    <span
                        id="descripcion-${producto.id}"
                        class="${
                            descripcionLarga
                                ? 'descripcion-texto descripcion-corta'
                                : 'descripcion-texto'
                        }">

                        ${
                            descripcionLarga
                                ? descripcionCorta
                                : producto.descripcion
                        }

                    </span>

                    ${
                        descripcionLarga
                            ? `
                                <button
                                    id="verMas-${producto.id}"
                                    class="ver-mas-btn"
                                    onclick="alternarDescripcion(
                                        ${producto.id}
                                    )">
                                    Ver más
                                </button>
                            `
                            : ''
                    }

                </p>

                <div class="specs-list">
                    ${specsHTML}
                </div>

                <div class="pricing">

                    <div class="price-container">

                        <span class="price-offer">
                            ${formatearMoneda(
                                producto.precioOferta
                            )}
                        </span>

                    </div>

                    <div class="cuotas-badge">
                        ⚡ Abonando por transferencia
                        15% OFF
                    </div>

                    <button
                        class="btn-add-cart"
                        onclick="agregarAlCarrito(
                            ${producto.id}
                        )">
                        Agregar al Carrito
                    </button>

                </div>

            </div>
        `;

        gridContainer.appendChild(card);

    });


    /* =========================================
    PAGINACIÓN
    ========================================= */

    if (totalPaginas > 1) {

        let paginacionHTML = `

            <div class="paginacion">

                <button
                    onclick="cambiarPagina(
                        ${paginaActual - 1}
                    )"
                    ${
                        paginaActual === 1
                            ? 'disabled'
                            : ''
                    }
                    aria-label="Página anterior">

                    ‹ Anterior

                </button>
        `;

        for (
            let i = 1;
            i <= totalPaginas;
            i++
        ) {

            paginacionHTML += `

                <button
                    class="${
                        i === paginaActual
                            ? 'active'
                            : ''
                    }"
                    onclick="cambiarPagina(${i})"
                    aria-label="Ir a página ${i}">

                    ${i}

                </button>
            `;
        }

        paginacionHTML += `

                <button
                    onclick="cambiarPagina(
                        ${paginaActual + 1}
                    )"
                    ${
                        paginaActual === totalPaginas
                            ? 'disabled'
                            : ''
                    }
                    aria-label="Página siguiente">

                    Siguiente ›

                </button>

                <div class="paginacion-info">

                    Mostrando
                    ${inicio + 1}
                    –
                    ${Math.min(
                        fin,
                        productosFiltrados.length
                    )}
                    de
                    ${productosFiltrados.length}
                    productos

                </div>

            </div>
        `;

        paginacionContainer.innerHTML =
            paginacionHTML;
    }
}


/* =========================================
CAMBIAR PÁGINA
========================================= */

function cambiarPagina(nuevaPagina) {

    const productosFiltrados =
        categoriaSeleccionada === 'Todas'
            ? productos
            : productos.filter(
                p =>
                    p.categoria.toLowerCase() ===
                    categoriaSeleccionada.toLowerCase()
            );

    const totalPaginas =
        Math.ceil(
            productosFiltrados.length /
            PRODUCTOS_POR_PAGINA
        );

    if (
        nuevaPagina < 1 ||
        nuevaPagina > totalPaginas
    ) {
        return;
    }

    paginaActual = nuevaPagina;

    renderizarProductos();

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}


/* =========================================
CARRITO
========================================= */

function agregarAlCarrito(id) {

    const producto =
        productos.find(
            p => p.id === id
        );

    if (!producto) {
        return;
    }

    const itemExistente =
        carrito.find(
            item => item.id === id
        );

    if (itemExistente) {

        itemExistente.cantidad++;

    } else {

        carrito.push({
            ...producto,
            cantidad: 1
        });
    }

    actualizarContadorCarrito();

    vistaActual = 'carrito';

    toggleCart(true);
}


function cambiarCantidad(id, cambio) {

    const item =
        carrito.find(
            i => i.id === id
        );

    if (item) {

        item.cantidad += cambio;

        if (item.cantidad <= 0) {

            carrito =
                carrito.filter(
                    i => i.id !== id
                );
        }
    }

    actualizarContadorCarrito();

    renderizarContenidoDrawer();
}


function eliminarDelCarrito(id) {

    carrito =
        carrito.filter(
            i => i.id !== id
        );

    actualizarContadorCarrito();

    renderizarContenidoDrawer();
}


function actualizarContadorCarrito() {

    const totalItems =
        carrito.reduce(
            (sum, item) =>
                sum + item.cantidad,
            0
        );

    document.getElementById(
        'cartCount'
    ).innerText = totalItems;
}

        if (

    renderizarContenidoDrawer();

/* =========================================
MÉTODO DE PAGO
========================================= */

function onPaymentMethodChange() {

    const selectElement =
        document.getElementById(
            'paymentMethodSelect'
        );

    if (!selectElement) {
        return;
    }

    metodoPagoGlobal =
        selectElement.value;

    const cuotasContainer =
        document.getElementById(
            'cuotasContainer'
        );

    const cuotasSelect =
        document.getElementById(
            'cuotasSelect'
        );

    const labelCuotas =
        document.getElementById(
            'labelCuotas'
        );

    cuotasSelect.innerHTML = '';


    if (
        metodoPagoGlobal ===
        'creditoDni'
    ) {

        cuotasContainer.style.display =
            'block';

        labelCuotas.innerText =
            "Cantidad de pagos (hasta 6 - +4% recargo por pago):";

        for (
            let i = 1;
            i <= 6;
            i++
        ) {

            const opt =
                document.createElement(
                    'option'
                );

            opt.value = i;

            opt.innerText =
                `${i} pago${
                    i > 1 ? 's' : ''
                } (+${i * 4}% recargo)`;

            if (
                i === cuotasGlobal
            ) {
                opt.selected = true;
            }

            cuotasSelect.appendChild(
                opt
            );
        }

    }

    else if (
        metodoPagoGlobal ===
        'tarjeta'
    ) {

        cuotasContainer.style.display =
            'block';

        labelCuotas.innerText =
            "Cantidad de cuotas (hasta 12 - +8% recargo por cuota):";

        for (
            let i = 1;
            i <= 12;
            i++
        ) {

            const opt =
                document.createElement(
                    'option'
                );

            opt.value = i;

            opt.innerText =
                `${i} cuota${
                    i > 1 ? 's' : ''
                } (+${i * 8}% recargo)`;

            if (
                i === cuotasGlobal
            ) {
                opt.selected = true;
            }

            cuotasSelect.appendChild(
                opt
            );
        }

    }

    else {

        cuotasContainer.style.display =
            'none';
    }

    updateCartUI();
}


/* =========================================
ACTUALIZAR CARRITO
========================================= */

function updateCartUI() {

    const paymentMethodSelect =
        document.getElementById(
            'paymentMethodSelect'
        );

    if (paymentMethodSelect) {

        metodoPagoGlobal =
            paymentMethodSelect.value;
    }

    const cuotasSelect =
        document.getElementById(
            'cuotasSelect'
        );

    if (
        cuotasSelect &&
        cuotasSelect.value
    ) {

        cuotasGlobal =
            parseInt(
                cuotasSelect.value
            ) || 1;
    }

    const detailsContainer =
        document.getElementById(
            'paymentDetailsContainer'
        );

    let subtotal =
        carrito.reduce(
            (sum, item) =>
                sum +
                (
                    item.precioOferta *
                    item.cantidad
                ),
            0
        );

    let recargoDescuentoValor = 0;

    if (
        metodoPagoGlobal ===
        'transferencia'
    ) {

        recargoDescuentoValor =
            -(subtotal * 0.15);

    }

    else if (
        metodoPagoGlobal ===
        'creditoDni'
    ) {

        const porcentajeRecargo =
            cuotasGlobal * 0.04;

        recargoDescuentoValor =
            subtotal *
            porcentajeRecargo;

    }

    else if (
        metodoPagoGlobal ===
        'tarjeta'
    ) {

        const porcentajeRecargo =
            cuotasGlobal * 0.08;

        recargoDescuentoValor =
            subtotal *
            porcentajeRecargo;
    }


    let costoEnvio = 12500;

    const provinciaSelect =
        document.getElementById(
            'provinciaSelect'
        );

    if (provinciaSelect) {

        const provKey =
            provinciaSelect.value;

        const tarifa =
            tarifasProvincias[provKey];

        if (tarifa) {

            costoEnvio =
                tarifa.costo;

            const infoRes =
                document.getElementById(
                    'envioInfoResumen'
                );

            if (infoRes) {

                infoRes.innerText =
                    `⏱️ Demora: ${
                        tarifa.demora
                    } | Envío: ${
                        formatearMoneda(
                            costoEnvio
                        )
                    }`;
            }
        }
    }


    let totalFinal =
        subtotal +
        costoEnvio +
        recargoDescuentoValor;


    if (detailsContainer) {

        const colorEstilo =
            recargoDescuentoValor < 0
                ? "#10b981"
                : "var(--text-main)";

        detailsContainer.innerHTML = `

            <div class="cart-summary-line">

                <span>
                    Subtotal:
                </span>

                <span>
                    ${formatearMoneda(
                        subtotal
                    )}
                </span>

            </div>

            <div class="cart-summary-line">

                <span>
                    Envío:
                </span>

                <span>
                    ${formatearMoneda(
                        costoEnvio
                    )}
                </span>

            </div>

            <div
                class="cart-summary-line"
                style="
                    color:${colorEstilo};
                    font-weight:600;
                ">

                <span>
                    Recargo/Descuento:
                </span>

                <span>

                    ${
                        recargoDescuentoValor < 0
                            ? '-'
                            : '+'
                    }

                    ${formatearMoneda(
                        Math.abs(
                            recargoDescuentoValor
                        )
                    )}

                </span>

            </div>
        `;
    }


    const totalPriceEl =
        document.getElementById(
            'cartTotalPrice'
        );

    if (totalPriceEl) {

        totalPriceEl.innerText =
            formatearMoneda(
                totalFinal
            );
    }


    const installmentSummary =
        document.getElementById(
            'installmentSummary'
        );

    if (installmentSummary) {

        if (
            metodoPagoGlobal ===
            'creditoDni'
        ) {

            const montoCuota =
                totalFinal /
                cuotasGlobal;

            installmentSummary.style.display =
                'block';

            installmentSummary.innerHTML = `

                💳 <strong>Plan de pago</strong><br>

                Cantidad de pagos:
                <strong>
                    ${cuotasGlobal}
                </strong><br>

                Monto de cada pago:
                <strong>
                    ${formatearMoneda(
                        montoCuota
                    )}
                </strong>
            `;

        }

        else if (
            metodoPagoGlobal ===
            'tarjeta'
        ) {

            const montoCuota =
                totalFinal /
                cuotasGlobal;

            installmentSummary.style.display =
                'block';

            installmentSummary.innerHTML = `

                💳 <strong>Plan de cuotas</strong><br>

                Cantidad de cuotas:
                <strong>
                    ${cuotasGlobal}
                </strong><br>

                Monto de cada cuota:
                <strong>
                    ${formatearMoneda(
                        montoCuota
                    )}
                </strong>
            `;

        }

        else {

            installmentSummary.style.display =
                'none';

            installmentSummary.innerHTML =
                '';
        }
    }
}

/* =========================================
ENVIAR PEDIDO WHATSAPP
========================================= */

function enviarPedidoWhatsApp() {

    const nombre =
        document.getElementById(
            'nombreCliente'
        ).value.trim();

    const dni =
        document.getElementById(
            'dniCliente'
        ).value.trim();

    const telefono =
        document.getElementById(
            'telefonoCliente'
        ).value.trim();

    const email =
        document.getElementById(
            'emailCliente'
        ).value.trim();

    const direccion =
        document.getElementById(
            'direccionCliente'
        ).value.trim();

    const localidad =
        document.getElementById(
            'localidadCliente'
        ).value.trim();

    const provincia =
        document.getElementById(
            'provinciaCliente'
        ).value.trim();

    const codigoPostal =
        document.getElementById(
            'codigoPostalCliente'
        ).value.trim();


    if (
        !nombre ||
        !dni ||
        !telefono ||
        !email ||
        !direccion ||
        !localidad ||
        !provincia ||
        !codigoPostal
    ) {

        alert(
            "Por favor, completa todos los datos obligatorios de entrega."
        );

        return;
    }


    const numeroGuia =
        generarCodigoSeguimiento();


    const provinciaKey =
        document.getElementById(
            'provinciaSelect'
        ).value;


    const datosProvincia =
        tarifasProvincias[
            provinciaKey
        ];


    const costoEnvio =
        datosProvincia.costo;


    let subtotal =
        carrito.reduce(
            (sum, item) =>
                sum +
                (
                    item.precioOferta *
                    item.cantidad
                ),
            0
        );


    let recargoDescuentoValor = 0;

    let textoMetodo = "";


    if (
        metodoPagoGlobal ===
        'transferencia'
    ) {

        recargoDescuentoValor =
            -(subtotal * 0.15);

        textoMetodo =
            "Transferencia Bancaria (15% OFF aplicado)";

    }

    else if (
        metodoPagoGlobal ===
        'creditoDni'
    ) {

        recargoDescuentoValor =
            subtotal *
            (
                cuotasGlobal *
                0.04
            );

        textoMetodo =
            `Crédito con DNI (${
                cuotasGlobal
            } pago${
                cuotasGlobal > 1
                    ? 's'
                    : ''
            }, +${
                cuotasGlobal * 4
            }% recargo)`;

    }

    else if (
        metodoPagoGlobal ===
        'tarjeta'
    ) {

        recargoDescuentoValor =
            subtotal *
            (
                cuotasGlobal *
                0.08
            );

        textoMetodo =
            `Tarjeta de Crédito (${
                cuotasGlobal
            } cuota${
                cuotasGlobal > 1
                    ? 's'
                    : ''
            }, +${
                cuotasGlobal * 8
            }% recargo)`;
    }


    const totalFinal =
        subtotal +
        costoEnvio +
        recargoDescuentoValor;


    let textoCuotas = "";


    if (
        metodoPagoGlobal ===
        'creditoDni'
    ) {

        const montoPorPago =
            totalFinal /
            cuotasGlobal;

        textoCuotas =
            `• Cantidad de pagos: ${
                cuotasGlobal
            }\n` +

            `• Monto de cada pago: ${
                formatearMoneda(
                    montoPorPago
                )
            }\n`;

    }

    else if (
        metodoPagoGlobal ===
        'tarjeta'
    ) {

        const montoPorCuota =
            totalFinal /
            cuotasGlobal;

        textoCuotas =
            `• Cantidad de cuotas: ${
                cuotasGlobal
            }\n` +

            `• Monto de cada cuota: ${
                formatearMoneda(
                    montoPorCuota
                )
            }\n`;

    }

    else {

        textoCuotas =
            `• Forma de pago: Pago único por transferencia\n`;
    }


    let detalleProductosTexto = "";


    carrito.forEach(item => {

        detalleProductosTexto +=
            `• ${
                item.cantidad
            }x ${
                item.nombre
            } — ${
                formatearMoneda(
                    item.precioOferta *
                    item.cantidad
                )
            }\n`;
    });


    let mensaje =
        `*NUEVA ORDEN DE COMPRA Y ENVÍO*\n`;

    mensaje +=
        `*LOGÍSTICA NOVA*\n`;

    mensaje +=
        `----------------------------------------\n`;

    mensaje +=
        `*N° de Seguimiento:* ${
            numeroGuia
        }\n`;

    mensaje +=
        `----------------------------------------\n\n`;


    mensaje +=
        `*DATOS DEL COMPRADOR*\n`;

    mensaje +=
        `• Nombre: ${
            nombre
        }\n`;

    mensaje +=
        `• DNI/CUIL: ${
            dni
        }\n`;

    mensaje +=
        `• Teléfono: ${
            telefono
        }\n`;

    mensaje +=
        `• Email: ${
            email
        }\n`;

    mensaje +=
        `• Dirección: ${
            direccion
        }, ${
            localidad
        }\n`;

    mensaje +=
        `• Provincia: ${
            provincia
        }\n`;

    mensaje +=
        `• Código Postal: ${
            codigoPostal
        }\n`;

    mensaje +=
        `• Zona de Envío: ${
            datosProvincia.nombre
        }\n`;

    mensaje +=
        `• Costo de envío: ${
            formatearMoneda(
                costoEnvio
            )
        }\n`;

    mensaje +=
        `• Demora estimada: ${
            datosProvincia.demora
        }\n\n`;


    mensaje +=
        `*PRODUCTOS SOLICITADOS*\n`;

    mensaje +=
        `${detalleProductosTexto}\n`;


    mensaje +=
        `*DESGLOSE DE PAGOS Y ENVÍO*\n`;

    mensaje +=
        `• Subtotal: ${
            formatearMoneda(
                subtotal
            )
        }\n`;

    mensaje +=
        `• Envío: ${
            formatearMoneda(
                costoEnvio
            )
        }\n`;

    mensaje +=
        `• Recargo/Descuento: ${
            recargoDescuentoValor < 0
                ? '-'
                : '+'
        }${
            formatearMoneda(
                Math.abs(
                    recargoDescuentoValor
                )
            )
        }\n`;

    mensaje +=
        `• Método: ${
            textoMetodo
        }\n`;

    mensaje +=
        `${textoCuotas}\n`;


    mensaje +=
        `*TOTAL A PAGAR:* ${
            formatearMoneda(
                totalFinal
            )
        }\n\n`;


    mensaje +=
        `*CÓDIGO DE SEGUIMIENTO*\n`;

    mensaje +=
        `${numeroGuia}\n\n`;

    mensaje +=
        `Solicito confirmación del pedido y datos para el pago.`;


    const mensajeCodificado =
        encodeURIComponent(
            mensaje
        );


    /*
     * CAMBIÁ ESTE NÚMERO POR EL WHATSAPP
     * QUE RECIBE LOS PEDIDOS.
     */

    const numeroWhatsApp =
        "5491155012447";


    const urlWhatsApp =
        `https://wa.me/${
            numeroWhatsApp
        }?text=${
            mensajeCodificado
        }`;


    carrito = [];

    actualizarContadorCarrito();

    window.location.href =
        urlWhatsApp;
}
