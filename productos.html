    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --accent-color: #f97316;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --border-color: #e5e7eb;
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .badge-stock {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: #10b981;
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .card-img-placeholder {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-category {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .card-desc {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .specs-list {
            background-color: #f9fafb;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 0.8rem;
        }

        .specs-list div {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .specs-list div:last-child {
            margin-bottom: 0;
        }

        .spec-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .spec-value {
            color: var(--text-main);
            font-weight: 600;
        }

        .pricing {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .price-original {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .price-container {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .price-offer {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .cuotas-badge {
            font-size: 0.75rem;
            color: var(--accent-color);
            font-weight: 600;
            margin-top: 4px;
        }

        .brand-footer {
            margin-top: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .brand-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

        // 2. Función para formatear números como moneda (ARS)
        function formatearMoneda(valor) {
            return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(valor);
        }

        // 3. Renderizar los productos en el DOM
        const gridContainer = document.getElementById('gridProductos');

        productos.forEach(producto => {
            // Crear especificaciones en HTML dinámicamente
            let specsHTML = '';
            for (const [key, value] of Object.entries(producto.especificaciones)) {
                if(value !== "" && value !== 0) {
                    specsHTML += `
                        <div>
                            <span class="spec-label">${key.charAt(0).toUpperCase() + key.slice(1)}:</span>
                            <span class="spec-value">${value}</span>
                        </div>
                    `;
                }
            }

            // Construir la tarjeta
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                ${producto.stock ? '<span class="badge-stock">Stock</span>' : ''}
                <div class="card-img-placeholder">
                    <span>${producto.marca}</span>
                </div>
                <div class="card-body">
                    <span class="card-category">${producto.categoria} &bull; ${producto.subcategoria}</span>
                    <h3 class="card-title">${producto.nombre}</h3>
                    <p class="card-desc">${producto.descripcion}</p>
                    
                    <div class="specs-list">
                        ${specsHTML}
                    </div>

                    <div class="pricing">
                        <div class="price-original">${formatearMoneda(producto.precio)}</div>
                        <div class="price-container">
                            <span class="price-offer">${formatearMoneda(producto.precioOferta)}</span>
                        </div>
                        <div class="cuotas-badge">${producto.cuotas} cuotas sin interés</div>
                        
                        <div class="brand-footer">
                            <span>Marca: <strong>${producto.marca}</strong></span>
                            ${producto.fuente.url !== "#" ? `<a href="${producto.fuente.url}" target="_blank">Ver web</a>` : ''}
                        </div>
                    </div>
                </div>
            `;

            gridContainer.appendChild(card);
        });
    </script>
